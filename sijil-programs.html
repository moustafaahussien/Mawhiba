<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة البرامج – منصة الموهبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@300;600;900&family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/platform.css">
<link rel="stylesheet" href="css/sijil.css">
<meta name="robots" content="noindex">
<style>
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;padding:12px 14px;margin-bottom:16px}
.bar .field{flex:0 1 220px}
.bar .tabs{margin:0;padding:0}
.prog-pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.prog-pick a{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;font-weight:700;font-size:.86rem;text-decoration:none;color:var(--ink2);background:rgba(255,255,255,.7);border:1px solid var(--glass-edge)}
.prog-pick a b{font-family:'Sora',sans-serif;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--c);font-size:.75rem}
.prog-pick a.on{color:#fff;background:var(--c);border-color:transparent}
.prog-pick a.on b{background:rgba(255,255,255,.25)}
.tile b{color:var(--c)}
.tile small{display:block;color:var(--muted);font-size:.8rem;font-weight:600}
.hint{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--c) 8%,#fff);color:var(--ink2);font-size:.92rem;line-height:1.8}
.form{padding:18px 20px;margin-bottom:16px;border:2px solid color-mix(in srgb,var(--c) 35%,#fff)}
.form h3{margin:0 0 10px;font-size:1.05rem}
.form .grid4 .wide{grid-column:1/-1}
.form .acts,.rowacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.form .acts{margin-top:14px}
.field input,.field select,.field textarea{font:inherit}
.stud-pick{grid-column:1/-1}
.stud-pick .quick{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.repeat{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:12px;align-items:end;padding:10px 12px;border-radius:12px;background:rgba(109,75,255,.06)}
.repeat label.chk{display:flex;align-items:center;gap:8px;font-weight:700}
.st{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700;font-size:.8rem;white-space:nowrap;background:rgba(26,22,64,.06)}
.st.s-active,.st.s-done{background:rgba(14,159,118,.14);color:#0B7A5B}
.st.s-planned{background:rgba(14,165,214,.12);color:#0B7FA6}
.st.s-paused,.st.s-postponed{background:rgba(232,165,10,.16);color:#8A5D00}
.st.s-finished{background:rgba(123,77,255,.12);color:#5B33D6}
.st.s-cancelled{background:rgba(226,56,111,.1);color:#B4234F}
td.bold{font-weight:700}
td .sm{display:block;color:var(--muted);font-size:.8rem;font-weight:600}
.rowacts .btn{margin:0;padding:5px 10px;font-size:.8rem}
.grp-h{margin:18px 4px 8px;font-size:1rem;color:var(--ink2)}
tr.past td{opacity:.75}
tr.today td{background:rgba(232,165,10,.1)}
.att{padding:16px 18px;margin-bottom:16px;border:2px solid rgba(14,159,118,.35)}
.del{padding:14px 16px;margin-bottom:16px;border:2px solid rgba(226,56,111,.35)}
.del .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:10px}
.places{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.privacy{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;margin-bottom:16px;border-radius:16px;background:rgba(226,56,111,.07);border:1px solid rgba(226,56,111,.25);color:var(--ink2);font-size:.92rem;line-height:1.8}
.week-now{padding:16px 18px;margin-bottom:16px;border:2px solid color-mix(in srgb,var(--c) 40%,#fff);display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.week-now .wk small{display:block;color:var(--muted);font-weight:700;font-size:.8rem}
.week-now .wk b{display:block;font-size:1.1rem;margin:2px 0}
.week-now .wk p{margin:4px 0 0;color:var(--ink2);font-size:.9rem;line-height:1.7;white-space:pre-line}
.wk-num{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 6px;border-radius:10px;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);font-family:'Sora',sans-serif;font-weight:800}
.ex{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700;font-size:.8rem;white-space:nowrap;margin:1px}
.ex.yes{background:rgba(14,159,118,.14);color:#0B7A5B}
.ex.no{background:rgba(226,56,111,.1);color:#B4234F}
.ex.wait{background:rgba(26,22,64,.06);color:var(--muted)}
.exnote{display:block;font-size:.82rem;color:var(--ink2);margin-top:3px;white-space:pre-line}
.topic{padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--c) 8%,#fff);margin:8px 0 12px;line-height:1.8}
.topic p{margin:2px 0 0;white-space:pre-line;color:var(--ink2);font-size:.9rem}
.exec-pick{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
.exec-pick label{cursor:pointer}
.exec-pick input{position:absolute;opacity:0;pointer-events:none}
.exec-pick span{display:inline-block;padding:9px 18px;border-radius:12px;font-weight:700;background:var(--glass2);border:1.5px solid var(--fline);color:var(--ink2)}
.exec-pick input[value="نعم"]:checked+span{background:linear-gradient(135deg,var(--teal),#2CC995);color:#fff;border-color:transparent}
.exec-pick input[value="لا"]:checked+span{background:linear-gradient(135deg,#E2386F,#B4234F);color:#fff;border-color:transparent}
.exec-pick input:focus-visible+span{outline:3px solid rgba(14,159,118,.4)}
.field textarea{min-height:76px;resize:vertical}
i.ck{font-style:normal}
.upd{padding:12px 16px;margin-bottom:16px;border-radius:16px;background:rgba(232,165,10,.12);border:1px solid rgba(232,165,10,.4);color:#6B4A00;font-size:.92rem;line-height:1.8}
@media print{.privacy,.form,.att,.del,.prog-pick,.hint{display:none!important}}
</style>
</head>
<body class="sj">
<div id="hdr"></div>
<main class="wrap">
  <div id="demo"></div>

  <section class="hero glass" id="hero"></section>

  <section class="teacher glass no-print" id="gate" hidden>
    <label class="field">رمز المعلمين (من منسق الموهبة)
      <input id="code" type="password" autocomplete="off" placeholder="••••••">
    </label>
    <button class="btn" id="open">دخول</button>
    <span class="note" id="gateNote" style="flex-basis:100%"></span>
  </section>

  <div id="app"></div>
</main>
<div id="ftr"></div>

<script src="js/config.js"></script>
<script src="js/sijil/config.js"></script>
<script src="js/sijil/programs.js"></script>
<script src="js/sijil/care-curriculum.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="js/sijil/common.js"></script>
<script src="js/sijil/i18n.js"></script>
<script>
$('#hdr').innerHTML = header('programs');
$('#demo').innerHTML = demoBanner(); $('#ftr').outerHTML = footerHtml();

const PERSON_STATUS = ['نشط', 'متوقف', 'أنهى البرنامج'];
const SESSION_STATUS = ['مجدولة', 'منفذة', 'مؤجلة', 'ملغاة'];
const ST_CLASS = { 'نشط': 's-active', 'متوقف': 's-paused', 'أنهى البرنامج': 's-finished', 'مجدولة': 's-planned', 'منفذة': 's-done', 'مؤجلة': 's-postponed', 'ملغاة': 's-cancelled' };
const TARGETS = ['جميع الطلاب', 'المرحلة الابتدائية', 'المرحلة المتوسطة', 'المرحلة الثانوية', 'الوعاء الإثرائي', 'المعلمون', 'أولياء الأمور'];

let P = getProgram(new URLSearchParams(location.search).get('p')) || getProgram(LS.get('tf_prog', '')) || getProgram('mentorship');
let DB = { staff: [], people: [], sessions: [], plan: [] }, TAB = 'people', YEAR = hijriYearNow(), OLD_SCRIPT = false;
const NEED_VER = 3;   // يطابق SCRIPT_VER في tools/sijil-script.gs
let EDIT = null, ATT = null, DEL = null, BULK = false, IMP = false, PG = '', UP = null, Q = { q: '', lead: '', status: '' }, KNOWN = [];

const split = s => String(s || '').split(/[،,\n]+/).map(x => normKey(x)).filter(Boolean);
const join = a => a.join('، ');
const mine = list => list.filter(r => r.prog === P.id && (r.year || '') === YEAR);
const todayISO = () => new Date(Date.now() + 3 * 36e5).toISOString().slice(0, 10);
const LOC = () => (window.SJ && SJ.lang() === 'en') ? 'en-GB' : 'ar-SA-u-ca-gregory-nu-latn';
const dayName = iso => { try { return new Date(iso + 'T12:00:00').toLocaleDateString(LOC(), { weekday: 'long' }); } catch (e) { return ''; } };
const fmtDay = iso => { if (!iso) return '—'; try { const d = new Date(iso + 'T12:00:00'); return isNaN(d) ? iso : d.toLocaleDateString(LOC(), { day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) { return iso; } };
/* بيانات يدخلها المستخدم: لا تُترجم */
const D = v => v ? `<span class="nt">${esc(v)}</span>` : '—';
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const EXEC = ['نعم', 'لا'];

/* ---------- ربط المعلم بطلاب صفه (staffGrade) ---------- */
const staffGrades = m => split(m.grade);
/* معلم الطالب: المحدد له، وإلا معلمو صفه (ومادته إن حُدّدت للطرفين) */
function leadsOf(r) {
  if (r.lead) return [r.lead];
  if (!P.staffGrade || !r.grade) return [];
  return mine(DB.staff).filter(m => staffGrades(m).includes(normKey(r.grade)) && (!m.field || !r.field || m.field === r.field)).map(m => m.name);
}
const isMine = (r, name) => leadsOf(r).includes(name);

/* ---------- توزيع الحصص: موضوع الأسبوع لكل حصة ---------- */
const planEnd = p => p.end || addDays(p.start, 6);
/* رقم الصف 1 – 12 من اسمه: «الصف 4» = «الرابع الابتدائي» = «… بنات» = «Grade 4»، و«الأول المتوسط» = 7 */
function gNum(g) {
  g = String(g || '').trim(); const m = g.match(/(\d+)/); if (m) return +m[1];
  const k = ['الأول', 'الثاني', 'الثالث', 'الرابع', 'الخامس', 'السادس'].findIndex(o => g.includes(o));
  return k < 0 ? 0 : k + 1 + (/ثانوي/.test(g) ? 9 : /متوسط/.test(g) ? 6 : 0);
}
const LEVELS = Array.from({ length: 12 }, (_, i) => 'الصف ' + (i + 1));
/* صف الحصة: المسجّل فيها، وإلا صف طلابها إن كانوا كلهم من صف واحد */
function gradeOf(s) {
  if (s.grade) return s.grade;
  const names = split(s.students); if (!names.length) return '';
  const gs = [...new Set(names.map(n => (mine(DB.people).find(x => normKey(x.name) === n) || {}).grade).filter(Boolean).map(gNum))];
  return gs.length === 1 && gs[0] ? 'الصف ' + gs[0] : '';
}
const gradeOk = (p, g) => !p.grade || (g && gNum(p.grade) === gNum(g));
const planList = () => mine(DB.plan).filter(p => p.start).sort((a, b) => (a.start).localeCompare(b.start) || gNum(a.grade) - gNum(b.grade) || (parseInt(a.week, 10) || 0) - (parseInt(b.week, 10) || 0));
/* الأسبوع الذي يقع فيه التاريخ (ويُقدَّم الموضوع الخاص بمجال الحصة على العام) */
function planFor(date, field, grade) {
  if (!P.plan || !date) return null;
  const hits = planList().filter(p => date >= p.start && date <= planEnd(p) && (!p.field || !field || p.field === field) && gradeOk(p, grade));
  const score = p => (p.grade ? 2 : 0) + (p.field && p.field === field ? 1 : 0);
  return hits.sort((a, b) => score(b) - score(a))[0] || null;
}
const planOf = s => planFor(s.date, s.field, gradeOf(s));
const sessionsOfPlan = p => mine(DB.sessions).filter(s => s.status !== 'ملغاة' && s.date >= p.start && s.date <= planEnd(p) && (!p.field || !s.field || s.field === p.field) && gradeOk(p, gradeOf(s)));
const titleOf = s => s.title || ((planOf(s) || {}).title) || '';
const exBadge = v => v === 'نعم' ? '<span class="ex yes">✓ نُفّذ البرنامج</span>' : v === 'لا' ? '<span class="ex no">✗ لم يُنفَّذ</span>' : '';

/* حقول كل جدول حسب البرنامج */
function DEF(table) {
  if (table === 'plan') return DEF_PLAN();
  if (table === 'staff') return [
    { k: 'name', l: 'الاسم', req: 1, list: 'staffList' },
    { k: 'role', l: 'الدور', list: 'roleList' },
    { k: 'spec', l: 'التخصص' },
    { k: 'field', l: P.staffGrade ? P.pField : 'المجال', opts: P.staffGrade ? P.fieldOpts : null, list: 'fieldList' },
    ...(P.staffGrade ? [{ k: 'grade', l: 'الصف الدراسي', type: 'grades' }] : []),
    { k: 'phone', l: 'الجوال', type: 'tel' },
    { k: 'email', l: 'البريد الإلكتروني', type: 'email' },
    { k: 'note', l: 'ملاحظة', wide: 1 }];
  if (table === 'people') return [
    { k: 'name', l: 'الاسم', req: 1, list: 'studList' },
    { k: 'sid', l: 'رقم الطالب' },
    { k: 'grade', l: 'الصف', type: 'grade', req: !P.gradeOptional },
    { k: 'cls', l: 'الفصل' },
    { k: 'field', l: P.pField, opts: P.fieldOpts, list: P.id === 'clusters' ? 'actList' : 'fieldList' },
    { k: 'lead', l: P.lead, type: 'lead' },
    ...(P.x1 ? [Object.assign({ k: 'x1' }, P.x1)] : []),
    ...(P.x2 ? [Object.assign({ k: 'x2' }, P.x2)] : []),
    { k: 'joined', l: 'تاريخ الانضمام', type: 'date' },
    { k: 'status', l: 'الحالة', type: 'select', opts: PERSON_STATUS },
    { k: 'note', l: 'ملاحظة', wide: 1 }];
  return [
    { k: 'date', l: 'التاريخ', type: 'date', req: 1 },
    { k: 'from', l: 'من الساعة', type: 'time' },
    { k: 'to', l: 'إلى الساعة', type: 'time' },
    { k: 'status', l: 'الحالة', type: 'select', opts: SESSION_STATUS },
    P.plan ? { k: 'title', l: 'العنوان (اتركه فارغاً ليؤخذ موضوع الأسبوع من توزيع الحصص)', wide: 1 } : { k: 'title', l: 'العنوان', req: 1, wide: 1 },
    { k: 'field', l: P.sField, opts: P.fieldOpts, list: 'fieldList' },
    ...(P.target ? [{ k: 'target', l: 'الفئة المستهدفة', list: 'targetList' }] : []),
    ...(P.means && P.means.length ? [{ k: 'means', l: 'وسيلة التقديم', type: 'select', opts: ['', ...P.means] }] : []),
    { k: 'lead', l: P.lead, type: 'lead' },
    ...(P.plan ? [{ k: 'grade', l: 'الصف (لربط الحصة بتوزيع صفها)', type: 'select', opts: ['', ...LEVELS] }] : []),
    { k: 'place', l: 'المكان', list: 'placeList', ph: 'مثال: مختبر العلوم 2' },
    { k: 'students', type: 'students' },
    ...(P.count ? [{ k: 'count', l: 'عدد الحضور (إن لم تُسجَّل الأسماء)', type: 'number' }] : []),
    ...(P.plan ? [{ k: 'exec', l: 'تم تنفيذ البرنامج؟', type: 'select', opts: ['', ...EXEC] }, { k: 'execNote', l: 'ملاحظات المعلم', type: 'textarea', wide: 1 }] : []),
    { k: 'note', l: 'ملاحظة', wide: 1 }];
}
function DEF_PLAN() {
  return [
    { k: 'week', l: 'رقم الحصة / الأسبوع', type: 'number', req: 1 },
    { k: 'grade', l: 'الصف (فارغ = كل الصفوف)', type: 'select', opts: ['', ...LEVELS] },
    { k: 'start', l: 'من تاريخ', type: 'date', req: 1 },
    { k: 'end', l: 'إلى تاريخ', type: 'date' },
    { k: 'field', l: 'المجال (اتركه فارغاً إن كان لكل الطلاب)', opts: P.fieldOpts, list: 'fieldList' },
    { k: 'title', l: 'عنوان الحصة / موضوع الأسبوع', req: 1, wide: 1 },
    { k: 'goals', l: 'الأهداف / المحتوى', type: 'textarea', wide: 1 },
    { k: 'note', l: 'ملاحظة', wide: 1 }];
}

function heroHtml() {
  document.documentElement.style.setProperty('--c', P.c);
  $('#hero').innerHTML = `<span class="kicker">للمعلمين · إدارة برامج النموذج</span><h1>${esc(P.name)}</h1>
    <p>أضف الفريق المنفّذ والمشاركين وجدول الجلسات والوحدات ومكانها، وسجّل الحضور بعد كل جلسة. البيانات في جدول السجل الخاص، ولا يظهر منها في صفحة البرنامج العامة إلا الأعداد والجدول بدون أسماء المشاركين.</p>
    <div class="prog-pick no-print">${PROGRAMS.map(p => `<a href="?p=${p.id}" style="--c:${p.c}" class="${p.id === P.id ? 'on' : ''}" data-prog="${p.id}"><b>${p.n}</b><span>${esc(p.name)}</span></a>`).join('')}</div>
    <div class="hint">💡 <span>${esc(P.hint)}</span></div>`;
}

/* ---------- التحميل ---------- */
async function load() {
  $('#app').innerHTML = '<div class="panel glass empty">جارٍ تحميل البيانات…</div>';
  try {
    const d = await API.programs();
    if (!d || !d.ok) {
      if (d && d.auth) { LS.set('tf_code', ''); showGate('رمز المعلمين غير صحيح أو تغيّر — اكتب الرمز الحالي.'); $('#app').innerHTML = ''; return; }
      throw new Error((d && d.error) || 'تعذر التحميل');
    }
    $('#gate').hidden = true;
    DB = { staff: d.staff || [], people: d.people || [], sessions: d.sessions || [], plan: d.plan || [] };
    OLD_SCRIPT = !d.demo && !((+d.ver || 0) >= NEED_VER);
    API.students().then(list => { KNOWN = (list || []).map(s => s.name); });
    render();
  } catch (e) { $('#app').innerHTML = `<div class="panel glass empty">تعذر الوصول إلى الجدول: ${esc(e.message)}</div>`; }
}
function showGate(msg) { $('#gate').hidden = false; $('#gateNote').textContent = msg || 'اكتب رمز المعلمين ثم اضغط «دخول».'; }
$('#open').onclick = async () => {
  const c = ($('#code').value || '').trim();
  if (!c) { toast('اكتب رمز المعلمين', 'err'); return; }
  const b = $('#open'); b.disabled = true; b.textContent = 'جارٍ التحقق…';
  try {
    const d = await API.check(c);
    if (!d || !d.ok) { toast((d && d.error) || 'رمز المعلمين غير صحيح', 'err'); return; }
    LS.set('tf_code', c); if (d.admin) LS.set('tf_admin', c); load();
  } catch (e) { toast('تعذر التحقق: ' + e.message, 'err'); }
  finally { b.disabled = false; b.textContent = 'دخول'; }
};

/* ---------- الحساب ---------- */
function stats() {
  const pe = mine(DB.people), st = mine(DB.staff), se = mine(DB.sessions).filter(s => s.status !== 'ملغاة');
  const done = se.filter(s => s.status === 'منفذة');
  const execYes = done.filter(s => s.exec === 'نعم').length, execNo = done.filter(s => s.exec === 'لا').length;
  let seats = 0, att = 0, count = 0;
  done.forEach(s => { const n = split(s.students).length, a = split(s.attended).length; seats += n; att += a; count += a || (parseInt(s.count, 10) || 0); });
  return { active: pe.filter(s => s.status !== 'متوقف').length, people: pe.length, staff: st.length, sessions: se.length, done: done.length, pct: seats ? Math.round(att / seats * 100) : null, count, execYes, execNo, weeks: P.plan ? planList().length : 0 };
}
const sessionsOf = name => mine(DB.sessions).filter(s => split(s.students).includes(normKey(name)));

/* ---------- العرض ---------- */
const TABS = () => [['people', P.people], ['staff', P.staff], ...(P.plan ? [['plan', 'توزيع الحصص']] : []), ['sessions', P.sessions]];
function render() {
  heroHtml();
  const S = stats();
  if (TAB === 'plan' && !P.plan) TAB = 'sessions';
  const years = [...new Set([...yearOptions(), ...['staff', 'people', 'sessions', 'plan'].flatMap(t => DB[t].map(r => r.year)).filter(Boolean)])].sort();
  const all = t => DB[t].filter(r => r.prog === P.id);
  let h = `<div class="bar glass no-print">
      <div class="tabs" role="tablist">${TABS().map(([k, l]) => `<button type="button" class="${k === TAB ? 'on' : ''}" data-tab="${k}">${esc(l)}</button>`).join('')}</div>
      <label class="field">العام الدراسي<select id="yearSel">${years.map(y => `<option${y === YEAR ? ' selected' : ''}>${esc(y)}</option>`).join('')}</select></label>
    </div>
    <div class="tiles">

/* ---------- رفع الطلاب من ملف Excel (تبويب المشاركين) ----------
   يقرأ كل أوراق الملف: عمود الاسم، والصف الدراسي، والحالة (لا يُقرأ رقم الهوية ولا يُحفظ).
   إن تكرر الطالب في أكثر من ورقة يُدمج في سطر واحد. إن خلا الصف وكان اسم الورقة رقماً (4 – 12) فهو صف الورقة،
   وإن اختلفت الحالة بين الأوراق تُعتمد حالة ورقة صفه. */
const BOYS = (GRADE_GROUPS.find(g => g.label === 'البنين') || { grades: [] }).grades;
function normGrade(g, sheet) {
  let s = normKey(g).replace(/^الصف\s*/, '').replace(/^ال?اول/, 'الأول').replace(/\s+(ثانوي|متوسط|ابتدائي)$/, ' ال$1').replace(/الالأ/, 'الأ');
  if (!s) { const n = parseInt(sheet, 10); return n >= 1 && n <= 12 ? BOYS[n - 1] || '' : ''; }
  if (GRADES.includes(s)) return s;
  const n = gNum(s); return n && BOYS[n - 1] && !/بنات|grade/i.test(s) ? BOYS[n - 1] : s;
}
function parseUp(wb) {
  const by = new Map(), src = [];
  wb.SheetNames.forEach(sn => {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: false, defval: '' });
    const hi = rows.findIndex(r => r.some(c => /^(الاسم|اسم الطالب|الاسم العربي)$/.test(normKey(c))));
    if (hi < 0) return;
    const head = rows[hi].map(normKey), col = re => head.findIndex(h => re.test(h));
    const ci = { name: col(/^(الاسم|اسم الطالب|الاسم العربي)$/), grade: col(/الصف/), status: col(/^الحالة$/), cls: col(/^الفصل$/), sid: col(/رقم الطالب/) };
    /* ورقة بلا عنوان «الحالة»: أول عمود بلا عنوان بعد عمود الصف */
    if (ci.status < 0 && ci.grade >= 0) { const j = head.findIndex((h, i) => i > ci.grade && !h); if (j >= 0) ci.status = j; }
    let n = 0;
    rows.slice(hi + 1).forEach(r => {
      const name = normKey(r[ci.name]); if (!name || /^عدد|^المجموع/.test(name)) return;
      const grade = normGrade(ci.grade >= 0 ? r[ci.grade] : '', sn), status = ci.status >= 0 ? normKey(r[ci.status]) : '';
      const k = name, o = by.get(k) || { name, grade: '', status: '', cls: '', sid: '', from: '' };
      if (!o.grade && grade) o.grade = grade;
      const own = gNum(sn) && gNum(sn) === gNum(grade || o.grade);   // ورقة صف الطالب
      if (own) o.own = true;
      if (status && (!o.status || own)) { o.status = status.replace('اضافتهم', 'إضافته').replace(/^في انتظار إضافته.*$/, 'في انتظار إضافته على بوابة موهبة'); o.from = sn; }
      if (ci.cls >= 0 && !o.cls) o.cls = normKey(r[ci.cls]);
      if (ci.sid >= 0 && !o.sid) o.sid = normKey(r[ci.sid]);
      by.set(k, o); n++;
    });
    src.push({ sheet: sn, n });
  });
  /* ملف بأوراق مسماة بالصفوف (4، 5، …): ورقة كل صف هي قائمته المعتمدة، فمن حُذف من ورقة صفه لا يُضاف */
  const sheetNums = new Set(src.map(x => /^\d{1,2}$/.test(String(x.sheet).trim()) ? +x.sheet : 0).filter(Boolean));
  const all = [...by.values()], out = all.filter(o => o.grade && sheetNums.has(gNum(o.grade)) && !o.own && !o.status);
  return { list: all.filter(o => !out.includes(o)), out, src };
}

  if (miss.length) { toast('أكمل الحقول المطلوبة: ' + miss.map(f => f.l).join('، '), 'err'); return; }
  if ((table === 'people' || table === 'staff') && mine(DB[table]).find(s => s.name === r.name && s.id !== r.id)) { toast('هذا الاسم مضاف بالفعل في هذا البرنامج لهذا العام', 'err'); return; }
  if (table === 'people' && !r.status) r.status = 'نشط';
  if (table === 'plan') {
    if (r.end && r.end < r.start) { toast('تاريخ نهاية الأسبوع قبل بدايته', 'err'); return; }
    if (!r.end) r.end = addDays(r.start, 4);
    const clash = mine(DB.plan).find(p => p.id !== r.id && (p.field || '') === (r.field || '') && gNum(p.grade) === gNum(r.grade) && p.start <= r.end && planEnd(p) >= r.start);
    if (clash) { toast(`يتداخل مع الأسبوع ${clash.week || ''} «${clash.title}» — عدّل التاريخ أو حدّد مجالاً مختلفاً`, 'err'); return; }
  }
  if (table === 'sessions' && P.plan && !r.grade) r.grade = gradeOf(r);
  if (table === 'sessions' && r.exec === 'لا' && !r.execNote) { toast('اكتب في «ملاحظات المعلم» سبب عدم تنفيذ البرنامج', 'err'); return; }
  let rows = [r];
  if (table === 'sessions') {
    if (!r.status) r.status = 'مجدولة';
    if (!r.id && $('#rep') && $('#rep').checked) {
      const until = $('#repUntil').value;
      if (!until || until <= r.date) { toast('اختر تاريخ نهاية التكرار بعد تاريخ الجلسة', 'err'); return; }
      rows = []; let d = new Date(r.date + 'T12:00:00');
      while (d.toISOString().slice(0, 10) <= until && rows.length < 40) { rows.push(Object.assign({}, r, { date: d.toISOString().slice(0, 10) })); d = new Date(+d + 7 * 864e5); }
    }
  }
  const b = $('#save'); b.disabled = true; b.textContent = 'جارٍ الحفظ…';
  try {
    const old = EDIT.row;
    const res = await API.progSave(table, rows);
    rows.forEach((x, i) => { const oid = x.id; x.id = res.ids[i]; const T = DB[table], j = T.findIndex(y => y.id === oid || y.id === x.id); if (j >= 0) T[j] = x; else T.push(x); });
    /* تغيير اسم عضو في الفريق: تحديثه عند المشاركين والجلسات */
    if (table === 'staff' && old.id && old.name && old.name !== r.name) {
      const pe = mine(DB.people).filter(s => s.lead === old.name).map(s => Object.assign(s, { lead: r.name }));
      const se = mine(DB.sessions).filter(s => s.lead === old.name).map(s => Object.assign(s, { lead: r.name }));
      if (pe.length) await API.progSave('people', pe); if (se.length) await API.progSave('sessions', se);
    }
    toast(rows.length > 1 ? `تم حفظ ${rows.length} جلسة` : 'تم الحفظ');
    EDIT = null; render();
  } catch (e) { toast(planErr(e), 'err'); if (e.auth) showGate(); b.disabled = false; b.textContent = 'حفظ'; }
}

/* ---------- الحضور ---------- */
function attHtml() {
  const s = DB.sessions.find(x => x.id === ATT); if (!s) return '';
  let names = split(s.students);
  if (!names.length) names = mine(DB.people).filter(x => x.status !== 'متوقف' && (!s.lead || isMine(x, s.lead))).map(x => x.name);
  const att = split(s.attended), first = s.status !== 'منفذة', pl = P.plan ? planOf(s) : null, tt = titleOf(s), gr = P.plan ? gradeOf(s) : '';
  return `<section class="att glass no-print" id="attBox"><h3><span>${P.plan ? 'تسجيل الحصة' : 'تسجيل الحضور'}</span> — ${tt ? D(tt) : '—'}</h3>
    <p class="sub">${esc(fmtDay(s.date))} · ${esc(dayName(s.date))} · ${D(s.place)} · ${D(s.lead)}</p>
    ${P.plan ? `${pl ? `<div class="topic"><b><span>المطلوب تنفيذه هذا الأسبوع</span> (<span>الأسبوع</span> ${esc(pl.week || '')}):</b> ${D(pl.title)}${pl.goals ? `<p class="nt">${esc(pl.goals)}</p>` : ''}</div>` : `<div class="topic"><span>لا يوجد موضوع لهذا الأسبوع في توزيع الحصص.</span>${!gr && mine(DB.plan).some(p => p.grade) ? ' <span>حدّد صف الحصة (زر «تعديل») ليظهر موضوع صفها.</span>' : ''}</div>`}
      <div class="field">هل تم تنفيذ البرنامج في هذه الحصة؟ *</div>
      <div class="exec-pick" id="execPick">${EXEC.map(v => `<label><input type="radio" name="exec" value="${v}"${s.exec === v ? ' checked' : ''}><span>${v === 'نعم' ? '✓ نعم، تم التنفيذ' : '✗ لا، لم يُنفَّذ'}</span></label>`).join('')}</div>
      <label class="field wide" style="margin:8px 0 12px">ملاحظات المعلم<textarea id="execNote" rows="3" placeholder="ما الذي نُفّذ؟ ملاحظات على الطلاب، أو سبب عدم التنفيذ…">${esc(s.execNote || '')}</textarea></label>
      <div class="field">الحضور والغياب</div>` : ''}
    ${names.length ? `<div class="quick" style="display:flex;gap:8px;margin:8px 0"><button type="button" class="btn ghost small" data-attall="1">تحديد الكل</button><button type="button" class="btn ghost small" data-attall="0">إلغاء الكل</button></div>
      <div class="checks" id="attChecks">${names.map(n => `<label><input type="checkbox" value="${esc(n)}"${(first && !att.length) || att.includes(n) ? ' checked' : ''}><span class="nt">${esc(n)}</span></label>`).join('')}</div>` : ''}
    ${P.count || !names.length ? `<label class="field" style="max-width:260px;margin-top:10px">عدد الحضور (إن لم تُسجَّل الأسماء)<input type="number" min="0" id="attCount" value="${esc(s.count || '')}"></label>` : ''}
    <div class="acts" style="display:flex;gap:8px;margin-top:12px"><button type="button" class="btn teal" id="attSave">${P.plan ? 'حفظ تسجيل الحصة' : 'حفظ الحضور وتعليم الجلسة «منفذة»'}</button><button type="button" class="btn ghost" data-cancel="1">إلغاء</button></div></section>`;
}
async function saveAtt() {
  const s = DB.sessions.find(x => x.id === ATT); if (!s) return;
  const all = $$('#attChecks input').map(i => i.value), chosen = $$('#attChecks input:checked').map(i => i.value);
  const cnt = $('#attCount') ? $('#attCount').value.trim() : s.count;
  const row = Object.assign({}, s, { students: s.students || join(all), attended: join(chosen), count: cnt || '', status: 'منفذة' });
  if (P.plan) {
    const ex = ($('#execPick input:checked') || {}).value || '', note = normKey($('#execNote').value);
    if (!ex) { toast('حدّد: هل تم تنفيذ البرنامج في هذه الحصة؟', 'err'); return; }
    if (ex === 'لا' && !note) { toast('اكتب في الملاحظات سبب عدم تنفيذ البرنامج', 'err'); $('#execNote').focus(); return; }
    row.exec = ex; row.execNote = note;
    if (!row.title) row.title = titleOf(s);   // تثبيت موضوع الأسبوع في سجل الحصة
    if (!row.grade) row.grade = gradeOf(s);
  }
  const b = $('#attSave'); b.disabled = true;
  try { await API.progSave('sessions', [row]); Object.assign(s, row); toast(all.length ? `تم الحفظ — الحضور: ${chosen.length} من ${all.length}` : 'تم الحفظ'); ATT = null; render(); }
  catch (e) { toast(e.message, 'err'); b.disabled = false; }
}

/* ---------- الحذف (مفتاح المشرف) ---------- */
function delHtml() {
  const { table, row } = DEL, label = table === 'sessions' ? `${titleOf(row)} — ${fmtDay(row.date)}` : table === 'plan' ? `${row.grade ? row.grade + ' · ' : ''}الحصة ${row.week || ''}: ${row.title}` : row.name;
  return `<section class="del glass no-print"><b><span>حذف</span> «${D(label)}»<span>؟</span></b>
    <div class="acts">${isDemo() ? '' : `<label class="field">مفتاح المشرف<input type="password" id="delKey" value="${esc(LS.get('tf_admin', ''))}"></label>`}
      <button type="button" class="btn" id="delGo" style="background:linear-gradient(135deg,#E2386F,#B4234F)">حذف نهائي</button><button type="button" class="btn ghost" data-cancel="1">إلغاء</button></div>
    <p class="sub" style="margin-top:6px">الحذف متاح للمشرف فقط. لإيقاف مشارك دون حذفه غيّر حالته إلى «متوقف».</p></section>`;
}
async function doDelete() {
  const { table, row } = DEL, key = $('#delKey') ? $('#delKey').value.trim() : '';
  if (!isDemo() && !key) { toast('اكتب مفتاح المشرف', 'err'); return; }
  try {
    await API.progDelete(table, [row.id], key);
    if (key) LS.set('tf_admin', key);
    DB[table] = DB[table].filter(x => x.id !== row.id); DEL = null; toast('تم الحذف'); render();
  } catch (e) { toast(e.message, 'err'); }
}

/* ---------- تصدير ---------- */
function csv(table) {
  const cols = DEF(table).filter(f => f.type !== 'students').map(f => [f.k, f.l]);
  if (table === 'sessions') cols.push(['students', 'المشاركون'], ['attended', 'الحضور']);
  const rows = table === 'sessions' && P.plan ? mine(DB.sessions).map(r => Object.assign({}, r, { title: titleOf(r) })) : table === 'plan' ? planList() : mine(DB[table]);
  if (!rows.length) { toast('لا توجد بيانات للتصدير', 'err'); return; }
  const cell = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const text = '﻿' + [cols.map(c => cell(c[1])).join(','), ...rows.map(r => cols.map(c => cell(r[c[0]])).join(','))].join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
  a.download = `${P.name}-${table}-${YEAR.replace(/\//g, '-')}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------- الأحداث ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button,a'); if (!t) return;
  if (t.dataset.prog) { e.preventDefault(); P = getProgram(t.dataset.prog); LS.set('tf_prog', P.id); history.replaceState(null, '', '?p=' + P.id); EDIT = ATT = DEL = null; BULK = IMP = false; PG = ''; UP = null; Q = { q: '', lead: '', status: '' }; if ($('#gate').hidden) render(); else heroHtml(); return; }
  if (t.dataset.tab) { TAB = t.dataset.tab; EDIT = ATT = DEL = null; BULK = IMP = false; UP = null; Q = { q: '', lead: '', status: '' }; render(); return; }
  if (t.dataset.up) { UP = {}; EDIT = ATT = DEL = null; BULK = IMP = false; render(); $('#upBox').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (t.id === 'upSave') return saveUp();
  if (t.dataset.imp) { IMP = true; BULK = false; EDIT = ATT = DEL = null; render(); $('#impBox').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (t.dataset.bulk) { BULK = true; IMP = false; EDIT = ATT = DEL = null; render(); $('#bulkBox').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (t.dataset.add) { const a = t.dataset.add, ns = a === 'plan' ? nextWeekStart() : ''; EDIT = { table: a, row: a === 'sessions' ? { date: todayISO(), status: 'مجدولة' } : a === 'people' ? { status: 'نشط', joined: todayISO() } : a === 'plan' ? { week: String(nextWeekNo()), start: ns, end: addDays(ns, 4) } : { role: P.staffOne } }; ATT = DEL = BULK = null; render(); $('#form').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (t.dataset.edit) { const row = DB[t.dataset.edit].find(x => x.id === t.dataset.id); if (row) { EDIT = { table: t.dataset.edit, row: Object.assign({}, row) }; ATT = DEL = null; BULK = false; render(); $('#form').scrollIntoView({ behavior: 'smooth', block: 'start' }); } return; }
  if (t.dataset.del) { const row = DB[t.dataset.del].find(x => x.id === t.dataset.id); if (row) { DEL = { table: t.dataset.del, row }; EDIT = ATT = null; render(); window.scrollTo({ top: $('.del').offsetTop - 100, behavior: 'smooth' }); } return; }
  if (t.dataset.att) { ATT = t.dataset.att; EDIT = DEL = null; render(); $('#attBox').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (t.dataset.cancel) { EDIT = ATT = DEL = null; BULK = IMP = false; UP = null; render(); return; }
  if (t.dataset.csv) { csv(t.dataset.csv); return; }
  if (t.dataset.pick) {
    const ld = ($('#form [data-k="lead"]') || {}).value || '';
    const theirs = new Set(mine(DB.people).filter(s => isMine(s, ld)).map(s => s.name));
    $$('#studChecks input').forEach(i => i.checked = t.dataset.pick === 'all' ? true : t.dataset.pick === 'none' ? false : theirs.has(i.value));
    if (t.dataset.pick === 'lead' && !ld) toast('اختر المنفّذ أولاً', 'info');
    return;
  }
  if (t.dataset.attall) { $$('#attChecks input').forEach(i => i.checked = t.dataset.attall === '1'); return; }
  if (t.id === 'save') return saveForm();
  if (t.id === 'attSave') return saveAtt();
  if (t.id === 'bulkSave') return saveBulk();
  if (t.id === 'impSave') return saveImport();
  if (t.id === 'delGo') return doDelete();
});
let qT = null;
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.q; if (!k || e.target.tagName === 'SELECT') return; Q[k] = e.target.value; clearTimeout(qT); qT = setTimeout(() => { const pos = e.target.selectionStart; render(); const el = $(`[data-q="${k}"]`); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (x) {} } }, 250); });
document.addEventListener('input', e => { if (e.target.closest && e.target.closest('#impBox')) impPreview(); });
document.addEventListener('change', e => { if (e.target.id === 'upFile' && e.target.files[0]) readUp(e.target.files[0]); });
document.addEventListener('change', e => { if (e.target.closest && e.target.closest('#impBox')) impPreview(); });
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.q; if (k && e.target.tagName === 'SELECT') { Q[k] = e.target.value; render(); } });

heroHtml();
if (isDemo() || LS.get('tf_code', '')) load(); else showGate();
</script>
</body>
</html>
