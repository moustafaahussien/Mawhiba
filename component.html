<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكوّن النموذج – منصة الموهبة</title>
<meta name="description" content="مكونات النموذج التام لتطوير الموهبة في مدارس دار الذكر: التعريف والأهداف وآلية التنفيذ والتقييم والنماذج، كما وردت في كتاب د. عادل بترجي.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@300;600;900&family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/platform.css">
<script src="js/config.js"></script>
<script src="js/components-data.js"></script>
<script src="js/platform.js"></script>
<style>
/* ---------- الهيرو ---------- */
.hero{padding:120px 0 20px}
.crumbs{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-bottom:18px;flex-wrap:wrap}
.crumbs a{color:var(--muted);transition:color .2s}.crumbs a:hover{color:var(--ink)}
.crumbs svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;transform:scaleX(var(--flip))}
.hero-card{display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center;padding:36px;border-radius:36px}
.hero-orb{position:relative;width:180px;height:180px;display:grid;place-items:center}
.hero-orb .gorb{--sz:150px}
.hero-orb .gorb svg{stroke-width:1.5}
.hero-orb .p{position:absolute;inset:15px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c) 60%,transparent);animation:pulse 4s ease-out infinite}
.hero-orb .p.p2{animation-delay:2s}
.hero-orb .ring{position:absolute;inset:-6px;border-radius:50%;border:2px dashed color-mix(in srgb,var(--c) 45%,transparent);animation:spin 40s linear infinite}
.hero-orb .num{position:absolute;bottom:-4px;inset-inline-end:-4px;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#fff;
  font-family:'Sora',sans-serif;font-weight:800;font-size:20px;color:color-mix(in srgb,var(--c) 75%,#1A1640);box-shadow:0 10px 22px -10px var(--c);border:2px solid color-mix(in srgb,var(--c) 35%,#fff);z-index:2}
.hero .tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.hero h1{font-family:var(--display);font-weight:900;font-size:clamp(28px,4.2vw,52px);line-height:1.35;margin-bottom:4px;
  background:linear-gradient(100deg,color-mix(in srgb,var(--c) 75%,#1A1640),var(--c) 40%,color-mix(in srgb,var(--c) 55%,#E8A50A) 70%,color-mix(in srgb,var(--c) 75%,#1A1640));
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:foil 8s linear infinite}
.hero .en{font-family:'Sora',sans-serif;font-weight:600;font-size:15px;color:var(--muted);margin-bottom:12px;direction:ltr;text-align:start}
html[dir=rtl] .hero .en{text-align:right}
.hero .sum{color:var(--ink);opacity:.85;font-size:clamp(16px,1.45vw,18px);max-width:46em;line-height:1.95}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
.fact{padding:16px 18px;border-radius:22px}
.fact span{display:block;font-family:var(--display);font-weight:600;font-size:12.5px;color:color-mix(in srgb,var(--c) 70%,#1A1640)}
.fact b{display:block;font-weight:600;font-size:15px;line-height:1.6;margin-top:2px}
@media(max-width:900px){.hero-card{grid-template-columns:1fr;text-align:center;justify-items:center;padding:28px 20px}.hero .tags{justify-content:center}.hero .en,html[dir=rtl] .hero .en{text-align:center}.facts{grid-template-columns:repeat(2,1fr)}.hero-orb{width:150px;height:150px}.hero-orb .gorb{--sz:124px}}
@media(max-width:480px){.facts{gap:10px}.fact{padding:12px 14px}.fact b{font-size:14px}}

/* ---------- شريط الأقسام ---------- */
.tabs{position:sticky;top:88px;z-index:20;margin:26px 0 8px;padding:8px;border-radius:22px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;font-family:var(--display);font-weight:600;font-size:14px;color:var(--muted);transition:background .2s,color .2s;white-space:nowrap}
.tabs a svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs a:hover{background:rgba(255,255,255,.7);color:var(--ink)}
.tabs a.on{color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));box-shadow:0 8px 18px -8px var(--c)}
@media(max-width:620px){.tabs{top:80px}}

/* ---------- الأقسام ---------- */
.sec{padding:34px 0;scroll-margin-top:150px}
.sec-h{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.sec-h .gorb{--sz:54px}
.sec-h .n{font-family:'Sora',sans-serif;font-weight:800;font-size:13px;color:color-mix(in srgb,var(--c) 70%,#1A1640);letter-spacing:.08em}
.sec-h h2{font-family:var(--display);font-weight:900;font-size:clamp(22px,2.6vw,32px);line-height:1.35}
.panel{padding:28px;border-radius:30px}
@media(max-width:620px){.panel{padding:20px;border-radius:24px}}
.about p{font-size:16.5px;line-height:2;margin-bottom:12px}
.about p:last-child{margin-bottom:0}
.src{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:12.5px;color:var(--muted);padding:3px 12px;border-radius:999px;background:rgba(26,22,64,.05)}
.src svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sub-h{font-family:var(--display);font-weight:900;font-size:17px;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.sub-h:first-child{margin-top:0}
.sub-h::after{content:"";flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 40%,transparent),transparent)}
html[dir=rtl] .sub-h::after{background:linear-gradient(270deg,color-mix(in srgb,var(--c) 40%,transparent),transparent)}
.local{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.local .tag{font-size:13.5px;padding:5px 14px}

/* الأهداف */
.goals{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.goals li{display:flex;gap:14px;align-items:flex-start;padding:18px;border-radius:22px;background:rgba(255,255,255,.62);border:1px solid var(--glass-edge);font-size:15.5px;line-height:1.9}
.goals li .gorb{--sz:44px;margin-top:2px}
@media(max-width:800px){.goals{grid-template-columns:1fr}}

/* المحتوى */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:14px;font-family:var(--display);font-weight:600;font-size:14.5px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 12%,#fff),rgba(255,255,255,.75));border:1px solid color-mix(in srgb,var(--c) 28%,#fff)}
.chip i{font-style:normal;font-family:'Sora',sans-serif;font-size:11.5px;font-weight:800;color:color-mix(in srgb,var(--c) 70%,#1A1640);opacity:.7}
.chip.other{background:rgba(26,22,64,.04);border-style:dashed;border-color:rgba(26,22,64,.18)}
.means{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.mean{padding:20px;border-radius:24px;background:rgba(255,255,255,.62);border:1px solid var(--glass-edge)}
.mean .mh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.mean .gorb{--sz:44px}
.mean h4{font-family:var(--display);font-weight:900;font-size:16px}
.mean ul{list-style:none;display:grid;gap:7px}
.mean li{display:flex;gap:8px;align-items:center;font-size:14.5px}
.mean li::before{content:"";width:7px;height:7px;border-radius:50%;flex:none;background:var(--c)}
@media(max-width:900px){.means{grid-template-columns:1fr}}
.note{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:14px;color:var(--muted);line-height:1.85}
.note svg{width:18px;height:18px;flex:none;stroke:var(--c);fill:none;stroke-width:2;margin-top:4px}
.callout{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin-top:22px;padding:20px 22px;border-radius:24px;
  background:linear-gradient(135deg,color-mix(in srgb,#E8A50A 16%,rgba(255,255,255,.85)),rgba(255,255,255,.7));border:1px solid color-mix(in srgb,#E8A50A 35%,#fff)}
.callout .gorb{--sz:46px;--c:#E8A50A}
.callout p{font-size:15.5px;line-height:1.95}

/* آلية التنفيذ */
.steps{list-style:none;display:grid;position:relative}
.steps li{display:grid;grid-template-columns:60px 1fr;gap:16px;align-items:start;position:relative;padding-bottom:16px}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:"";position:absolute;inset-inline-start:28px;top:56px;bottom:-4px;width:4px;border-radius:4px;background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 25%,transparent))}
.steps li:last-child::before{display:none}
.steps .gorb{--sz:58px}
.steps .txt{padding:14px 18px;border-radius:18px;background:rgba(255,255,255,.62);border:1px solid var(--glass-edge);font-size:15.5px;line-height:1.85;margin-top:3px}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:9px;color:color-mix(in srgb,var(--c) 75%,#1A1640);background:color-mix(in srgb,var(--c) 10%,#fff);border:1px solid color-mix(in srgb,var(--c) 24%,#fff);cursor:pointer}
.fchip svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.circle{margin-top:24px;padding:22px;border-radius:26px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 14%,rgba(255,255,255,.85)),rgba(255,255,255,.7));border:1px solid color-mix(in srgb,var(--c) 30%,#fff)}
.circle .ch{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.circle .ch .gorb{--sz:48px}
.circle h3{font-family:var(--display);font-weight:900;font-size:18px}
.circle .goal{font-size:15px;line-height:1.9;color:var(--ink);opacity:.85;margin-bottom:14px}
.qs{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:10px;counter-reset:q}
.qs li{counter-increment:q;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.75);border:1px solid var(--glass-edge);font-size:14.5px;line-height:1.8}
.qs li::before{content:"؟";flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 60%,#fff),var(--c))}
html[dir=ltr] .qs li::before{content:"?"}
.circle .end{margin-top:12px;font-size:14px;color:var(--muted)}
@media(max-width:800px){.qs{grid-template-columns:1fr}}

/* التقييم */
.evals{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ev{padding:20px;border-radius:24px;background:rgba(255,255,255,.62);border:1px solid var(--glass-edge)}
.ev .eh{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.ev .gorb{--sz:46px}
.ev h4{font-family:var(--display);font-weight:900;font-size:16.5px;line-height:1.5}
.ev .fno{font-size:12px;color:var(--muted)}
.ev p{font-size:14.5px;line-height:1.9;color:var(--ink);opacity:.85}
.scale{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.scale span{flex:1;min-width:90px;text-align:center;padding:8px 6px;border-radius:12px;font-family:var(--display);font-weight:600;font-size:13px;background:color-mix(in srgb,var(--c) 10%,#fff);border:1px solid color-mix(in srgb,var(--c) 24%,#fff)}
.scale span b{display:block;font-family:'Sora',sans-serif;font-size:12px;color:var(--muted);font-weight:600}
@media(max-width:800px){.evals{grid-template-columns:1fr}}

/* النماذج */
.ftable{border-radius:20px;overflow:auto;border:1px solid var(--glass-edge);background:rgba(255,255,255,.55)}
.ftable table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:600px}
.ftable th{font-family:var(--display);font-weight:600;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));padding:10px 16px;text-align:start}
.ftable td{padding:11px 16px;border-top:1px solid var(--line);vertical-align:top}
.ftable td.fno{font-family:'Sora',sans-serif;font-weight:800;white-space:nowrap;color:color-mix(in srgb,var(--c) 70%,#1A1640)}
.ftable td.nm{font-weight:600}
.ftable td.us{color:var(--muted);font-size:13.5px}
.ftable tr.hl td{background:color-mix(in srgb,var(--c) 14%,#fff);transition:background 1s}

/* هذا العام */
.cd-card{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:22px 24px;margin-bottom:22px;border-radius:26px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 20%,rgba(255,255,255,.85)),rgba(255,255,255,.7) 60%,color-mix(in srgb,#E8A50A 14%,rgba(255,255,255,.8)));
  border:1px solid color-mix(in srgb,var(--c) 35%,#fff);box-shadow:0 22px 44px -28px var(--c)}
.cd-info{display:flex;align-items:center;gap:16px}
.cd-info .gorb{--sz:60px}
.cd-info small{display:block;font-family:var(--display);font-weight:600;font-size:13px;color:color-mix(in srgb,var(--c) 70%,#1A1640)}
.cd-info h3{font-family:var(--display);font-weight:900;font-size:clamp(18px,2vw,22px);line-height:1.5}
.cd-info span{font-size:14px;color:var(--muted)}
@media(max-width:700px){.cd-card{flex-direction:column;align-items:stretch}.cd-card .cd-boxes{justify-content:center}}
.div{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.dv{padding:18px;border-radius:22px;background:rgba(255,255,255,.62);border:1px solid var(--glass-edge)}
.dv span{display:block;font-family:var(--display);font-weight:600;font-size:13px;color:var(--muted)}
.dv b{display:block;font-family:'Sora',sans-serif;font-weight:800;font-size:30px;line-height:1.2;color:color-mix(in srgb,var(--c) 75%,#1A1640)}
.dv b small{font-size:15px;color:var(--muted);font-weight:600}
.dv .bar{height:8px;border-radius:8px;background:rgba(26,22,64,.07);overflow:hidden;margin-top:8px}
.dv .bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 50%,#fff),var(--c));transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
@media(max-width:700px){.div{grid-template-columns:1fr}}
.units{border-radius:20px;overflow:auto;border:1px solid var(--glass-edge);background:rgba(255,255,255,.55)}
.units table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:720px}
.units th{font-family:var(--display);font-weight:600;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));padding:10px 14px;text-align:start}
.units td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:top}
.units tr.past td{opacity:.6}
.units .st{display:inline-block;font-family:var(--display);font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.units .st.done{background:#E3F6EF;color:#0B7A5B}
.units .st.next{background:color-mix(in srgb,var(--c) 14%,#fff);color:color-mix(in srgb,var(--c) 75%,#1A1640)}
.units .st.tba{background:rgba(26,22,64,.06);color:var(--muted)}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:8px}
.fl{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:rgba(255,255,255,.62);border:1px solid var(--glass-edge);transition:transform .2s,box-shadow .2s}
.fl:hover{transform:translateY(-3px);box-shadow:0 18px 30px -20px var(--c)}
.fl .ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--fc,var(--c)) 14%,#fff)}
.fl .ico svg{width:22px;height:22px;stroke:var(--fc,var(--c));fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fl b{display:block;font-weight:600;font-size:14.5px;line-height:1.5;word-break:break-word}
.fl small{color:var(--muted);font-size:12.5px}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;padding:10px 0}
.loading i{width:18px;height:18px;border-radius:50%;border:3px solid color-mix(in srgb,var(--c) 25%,#fff);border-top-color:var(--c);animation:spin .8s linear infinite}

/* أثر البرنامج */
.study p.intro{font-size:15.5px;line-height:2;margin-bottom:18px}
.srows{display:grid;gap:14px}
.srow{display:grid;grid-template-columns:200px 1fr 120px;gap:16px;align-items:center;padding:14px 18px;border-radius:20px;background:rgba(255,255,255,.62);border:1px solid var(--glass-edge)}
.srow .nm{font-family:var(--display);font-weight:600;font-size:15px;line-height:1.5}
.srow .bars{display:grid;gap:6px}
.srow .br{display:grid;grid-template-columns:auto 1fr 40px;white-space:nowrap;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.srow .tr{height:14px;border-radius:7px;background:rgba(26,22,64,.06);overflow:hidden}
.srow .tr i{display:block;height:100%;border-radius:7px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.srow .br b{font-family:'Sora',sans-serif;font-weight:800;color:var(--ink);text-align:end}
.srow .t{text-align:center}
.srow .t b{display:block;font-family:'Sora',sans-serif;font-weight:800;font-size:20px;color:color-mix(in srgb,var(--c) 75%,#1A1640)}
.srow .t span{display:inline-block;margin-top:2px;font-family:var(--display);font-size:11.5px;font-weight:600;padding:1px 9px;border-radius:999px}
.srow .t .y{background:#E3F6EF;color:#0B7A5B}
.srow .t .n{background:rgba(26,22,64,.06);color:var(--muted)}
.scale-note{font-size:12.5px;color:var(--muted);margin-top:10px}
.snotes{list-style:none;display:grid;gap:10px;margin-top:18px}
.snotes li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.9}
.snotes li svg{width:20px;height:20px;flex:none;stroke:var(--c);fill:none;stroke-width:2.2;margin-top:4px;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:760px){.srow{grid-template-columns:1fr;gap:10px}.srow .t{text-align:start}}

/* عناصر عامة للمكونات */
.mh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.mh .gorb{--sz:44px}
.mh h4,.mh h3{font-family:var(--display);font-weight:900;font-size:16px;line-height:1.5}
.mh small{display:block;font-family:'Sora',sans-serif;font-weight:800;font-size:12px;color:color-mix(in srgb,var(--c) 70%,#1A1640)}
.lead-p{font-size:15px;line-height:1.9;color:var(--ink);opacity:.85;margin-bottom:14px}
.tgt{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;margin-top:18px;padding:16px 18px;border-radius:22px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 12%,rgba(255,255,255,.85)),rgba(255,255,255,.65));border:1px solid color-mix(in srgb,var(--c) 28%,#fff)}
.tgt .gorb{--sz:44px}
.tgt b{display:block;font-family:var(--display);font-weight:900;font-size:15px;color:color-mix(in srgb,var(--c) 75%,#1A1640)}
.tgt p{font-size:15px;line-height:1.9;margin:2px 0 0}
.ggroups{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.gg{padding:20px;border-radius:24px;background:rgba(255,255,255,.62);border:1px solid var(--glass-edge)}
.gg ul,.dots{list-style:none;display:grid;gap:8px}
.gg li,.dots li{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;line-height:1.8}
.gg li::before,.dots li::before{content:"";width:7px;height:7px;border-radius:50%;flex:none;margin-top:10px;background:var(--c)}
@media(max-width:900px){.ggroups{grid-template-columns:1fr}}
.subs{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.sub{padding:24px;border-radius:28px}
.sub .gorb{--sz:52px}
.sub h3{font-size:18px}
.sub p.d{font-size:15px;line-height:1.9}
.sub .sh{font-family:var(--display);font-weight:900;font-size:14px;color:color-mix(in srgb,var(--c) 75%,#1A1640);margin:14px 0 8px}
@media(max-width:900px){.subs{grid-template-columns:1fr}}
.chips.sm .chip{font-size:13px;padding:5px 12px;border-radius:11px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cards.n2,.cards.n4{grid-template-columns:repeat(2,1fr)}
.kc{padding:20px;border-radius:24px;background:rgba(255,255,255,.62);border:1px solid var(--glass-edge)}
.kc p{font-size:14.5px;line-height:1.9;margin-bottom:10px}
@media(max-width:900px){.cards,.cards.n2,.cards.n4{grid-template-columns:1fr}}
.figs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.fig{padding:18px;border-radius:22px;background:rgba(255,255,255,.62);border:1px solid var(--glass-edge)}
.fig b{display:block;font-family:'Sora',sans-serif;font-weight:800;font-size:34px;line-height:1.1;color:color-mix(in srgb,var(--c) 75%,#1A1640)}
.fig span{display:block;font-size:13.5px;color:var(--muted);line-height:1.6;margin-top:4px}
@media(max-width:900px){.figs{grid-template-columns:repeat(2,1fr)}}
.ftable td.num{font-family:'Sora',sans-serif;font-weight:600;white-space:nowrap}
.div.two{grid-template-columns:repeat(2,1fr)}
.callout p{margin:0}
.callout + .callout{margin-top:12px}

/* قيد الإعداد + المكونات الأخرى */
.soon{padding:40px 28px;border-radius:30px;text-align:center}
.soon .gorb{--sz:76px;margin:0 auto 14px}
.soon h2{font-family:var(--display);font-weight:900;font-size:24px;margin-bottom:8px}
.soon p{color:var(--muted);max-width:36em;margin:0 auto}
.others{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 14px;scrollbar-width:thin}
.oth{flex:none;display:flex;align-items:center;gap:12px;padding:12px 18px 12px 12px;border-radius:20px;transition:transform .2s}
html[dir=rtl] .oth{padding:12px 12px 12px 18px}
.oth:hover{transform:translateY(-4px)}
.oth .gorb{--sz:42px}
.oth b{display:block;font-family:var(--display);font-weight:600;font-size:14.5px;white-space:nowrap}
.oth small{display:block;font-size:11.5px;color:var(--muted)}
.oth.dim{opacity:.72}
.res-h{font-family:var(--display);font-weight:900;font-size:17px;margin:4px 0 12px;display:flex;align-items:center;gap:10px}
.notfound{padding:160px 0 60px;text-align:center}

const COMPS = window.TP_COMPONENTS;
const id = (new URLSearchParams(location.search).get('c') || '').toLowerCase();
const C = COMPS.find(c => c.id === id);
let DATA = null, FOLDER = { state: 'none', data: null }, folderReq = '';

const L = o => (o && (o[TP.lang()] || o.ar)) || [];
const compLink = c => `component.html?c=${c.id}`;
const has = k => { const v = C[k]; return !!(v && (!Array.isArray(v) || v.length)); };

/* الأقسام: يظهر منها ما له محتوى في ملف البيانات */
function sectionList(){
  return [
    ['about','info','s.about', true],
    ['goals','target','s.goals', has('goals') || has('goalGroups')],
    ['subs','layers','s.subs', has('subs')],
    ['content','grid','s.content', has('cards') || has('criteria') || has('branches') || has('recs')],
    ['how','list','s.how', has('steps')],
    ['eval','check','s.eval', has('evals')],
    ['forms','file','s.forms', has('forms')],
    ['year','cal','s.year', true],
    ['impact','chart','s.impact', has('study')]
  ].filter(s => s[3]);
}
let SECTIONS = [];
/* عنوان القسم حسب محتواه */
function label(sid, k){
  if (C.titles && C.titles[sid]) return TP.tx(C.titles[sid]);
  if (sid === 'content') return TP.t(has('branches') ? 's.content.ge' : (has('cards') || has('criteria')) ? 's.content' : 's.recs');
  return TP.t(k);
}
const secHead = (i, ic, k, sid) => `<div class="sec-h"><span class="gorb">${TP.icon(ic)}</span><div><div class="n">${String(i + 1).padStart(2, '0')}</div><h2>${label(sid, k)}</h2></div></div>`;

/* بيانات الجدول: تبويب «المكونات» ← [الاسم, الحالة, مجلد المصادر, المسؤول, ملاحظة] */
function compState(){
  const r = DATA ? TP.rowsFor(DATA.components, C.id)[0] : null;
  if (!r) return {};
  const folder = String(r[2] || '').trim().replace(/^.*\/folders\/([\w-]+).*$/, '$1').replace(/^.*[?&]id=([\w-]+).*$/, '$1');
  return { status: String(r[1] || '').trim(), folder, lead: r[3] || '', note: r[4] || '' };
}
/* تبويب «وحدات المكونات» ← [عنوان الوحدة, الفرع, الفئة المستهدفة, وسيلة التقديم, التاريخ, الوقت, المشرف, ملاحظة] */
function units(){
  const rows = DATA ? TP.rowsFor(DATA.units, C.id).filter(r => (r[0] || '').trim()) : [];
  return rows.map(r => ({ ar: r[0], en: r[0], branch: r[1] || '', target: r[2] || '', mean: r[3] || '', d: TP.parseDate(r[4], r[5]), e: null, sup: r[6] || '', note: r[7] || '' }))
    .sort((a, b) => (a.d ? +a.d : 9e15) - (b.d ? +b.d : 9e15));
}

    goals: () => `<div class="panel glass reveal">${has('goals') ? `<ul class="goals">${L(C.goals).map((g, i) => `<li><span class="gorb"><b>${i + 1}</b></span><span>${TP.esc(g)}</span></li>`).join('')}</ul>` : ''}
        ${has('goalGroups') ? `<div class="ggroups">${C.goalGroups.map(g => `<div class="gg"><div class="mh"><span class="gorb">${TP.icon(g.icon)}</span><h4>${TP.esc(TP.tx(g.t))}</h4></div><ul>${L(g).map(x => `<li>${TP.esc(x)}</li>`).join('')}</ul></div>`).join('')}</div>` : ''}</div>`,
    subs: () => `<div class="subs">${C.subs.map((s, i) => `<article class="sub glass reveal" style="--c:${['#7B4DFF','#E2386F','#0E9F76','#E8A50A'][i % 4]}">

        <ol class="steps">${C.steps.map((s, i) => `<li><span class="gorb"><b>${i + 1}</b></span><div class="txt">${TP.esc(TP.tx(s))}${s.f && s.f.length ? `<div class="fchips">${s.f.map(f => `<a class="fchip" data-form="${f}">${TP.icon('file')}${TP.t('form')} ${f}</a>`).join('')}</div>` : ''}</div></li>`).join('')}</ol>

      return `<div class="panel glass reveal">
        <div class="ftable"><table><thead><tr><th>${TP.t('f.no')}</th><th>${TP.t('f.name')}</th>${withUse ? `<th>${TP.t('f.use')}</th>` : ''}</tr></thead>
        <tbody>${C.forms.map(f => `<tr id="form-${f.no}"><td class="fno">${f.no}</td><td class="nm">${TP.esc(TP.tx(f))}</td>${withUse ? `<td class="us">${TP.esc(TP.tx(f.use))}</td>` : ''}</tr>`).join('')}</tbody></table></div>
        ${C.formsNote ? `<div class="note">${TP.icon('book')}<span>${TP.esc(TP.tx(C.formsNote))}</span></div>` : ''}
        ${C.staffPage ? `<p style="margin-top:14px"><a class="btn ghost" href="${C.staffPage}">${TP.icon('file')}<span>${TP.t('f.staff')}</span></a></p>` : ''}
      </div>`; },
    year: () => `<div class="panel glass reveal">${yearHtml()}
        <div class="res-h" style="margin-top:22px">${TP.t('res.school')}</div>
        <div id="folderBox">${folderHtml(st)}</div></div>`,
    impact: () => `<div class="panel glass study reveal">${studyHtml()}</div>`
  };

  main.innerHTML = hero + `
  <nav class="tabs glass no-print" id="tabs">${SECTIONS.map(([sid, ic, k]) => `<a href="#${sid}" data-sec="${sid}">${TP.icon(ic)}<span>${label(sid, k)}</span></a>`).join('')}</nav>
  ${SECTIONS.map(([sid, ic, k], i) => `<section class="sec" id="${sid}">${secHead(i, ic, k, sid)}${body[sid]()}</section>`).join('')}
  <p class="note" style="justify-content:center">${TP.icon('book')}<span>${TP.t('bookSrc')}</span></p>
  ${othersHtml()}`;

  TP.observe(main.querySelectorAll('.reveal'));
  TP.tick();
  requestAnimationFrame(() => setTimeout(() => main.querySelectorAll('[data-w]').forEach(el => el.style.width = el.dataset.w), 120));
  spy();
  if (st.folder && folderReq !== st.folder) loadFolder(st.folder);
}

function yearHtml(){
  const U = units();
  if (!U.length) return `<div class="empty">${TP.icon('cal')}${TP.t('u.none')}</div>`;
  const now = Date.now();
  const nx = TP.nextDate(U.filter(u => u.d));
  const nb = new Set(U.map(u => u.branch.trim()).filter(Boolean)).size;
  const nm = new Set(U.map(u => u.mean.trim()).filter(Boolean)).size;
  const done = U.filter(u => u.d && TP.phase(u, now) === 'past').length;
  const card = nx ? `<div class="cd-card"><div class="cd-info"><span class="gorb">${TP.icon('cal')}</span>
      <div><small>${TP.t(TP.phase(nx, now) === 'cur' ? 'u.cur' : 'u.next')}</small><h3>${TP.esc(nx.ar)}</h3><span>${TP.esc([nx.branch, nx.target, TP.dateText(nx)].filter(Boolean).join(' · '))}</span></div></div>
      ${TP.countdown(nx)}</div>` : '';
  const dv = (k, v, max) => `<div class="dv"><span>${TP.t(k)}</span><b>${TP.fmt(v)}${max ? ` <small>${TP.t('of')} ${TP.fmt(max)}</small>` : ''}</b>${max ? `<div class="bar"><i data-w="${Math.min(100, v / max * 100)}%" style="width:0"></i></div>` : ''}</div>`;
  /* للإثراء العام: مؤشرات التنوع في الفروع والوسائل (من بنود تقييم البرنامج) */
  const tiles = has('branches') ? dv('d.units', U.length) + dv('d.branches', nb, L(C.branches).length - 1) + dv('d.means', nm)
                                : dv('d.units', U.length) + dv('d.done', done, U.length);
  return `${card}<div class="div${has('branches') ? '' : ' two'}">${tiles}</div>
    <div class="units"><table><thead><tr>${['u.title','u.branch','u.target','u.mean','u.date','u.sup','u.st'].map(k => `<th>${TP.t(k)}</th>`).join('')}</tr></thead><tbody>
    ${U.map(u => { const ph = u.d ? TP.phase(u, now) : 'tba';
      const stc = ph === 'past' ? ['done', 'u.done'] : ph === 'tba' ? ['tba', 'u.tba'] : ['next', ph === 'cur' ? 'u.cur' : 'u.up'];
      return `<tr class="${ph === 'past' ? 'past' : ''}"><td><b>${TP.esc(u.ar)}</b>${u.note ? `<br><small class="muted">${TP.esc(u.note)}</small>` : ''}</td><td>${TP.esc(u.branch || '—')}</td><td>${TP.esc(u.target || '—')}</td><td>${TP.esc(u.mean || '—')}</td>
        <td>${u.d ? TP.esc(TP.dateText(u)) : '—'}</td><td>${TP.esc(u.sup || '—')}</td><td><span class="st ${stc[0]}">${TP.t(stc[1])}</span></td></tr>`; }).join('')}
    </tbody></table></div>`;
}

const FILE_KIND = m => /pdf/.test(m) ? ['pdf', '#E0354B'] : /presentation|powerpoint/.test(m) ? ['slides', '#F07B0F'] : /spreadsheet|excel/.test(m) ? ['sheet', '#0E9F76'] :
  /video/.test(m) ? ['video', '#7B4DFF'] : /image/.test(m) ? ['image', '#0EA5D6'] : /document|word/.test(m) ? ['file', '#2F6FE0'] : ['file', ''];
function fileCard(f){
  const url = TP.safeUrl(f.url); if (!url) return '';
  const [ic, col] = FILE_KIND(f.mime || '');
  return `<a class="fl" href="${TP.esc(url)}" target="_blank" rel="noopener"${col ? ` style="--fc:${col}"` : ''}><span class="ico">${TP.icon(ic)}</span><span><b>${TP.esc(f.name)}</b><small>${f.updated ? TP.t('updated') + ': ' + TP.fmtDate(new Date(f.updated)) : ''}</small></span></a>`;
}
function folderHtml(st){
  if (!st.folder) return `<div class="empty">${TP.icon('folder')}${TP.t('res.none')}</div>`;
  if (FOLDER.state === 'loading' || FOLDER.state === 'none') return `<div class="loading"><i></i>${TP.t('res.loading')}</div>`;
  if (FOLDER.state === 'error' || !FOLDER.data || FOLDER.data.error) return `<div class="empty">${TP.icon('folder')}${TP.t('res.err')}</div>`;
  const groups = FOLDER.data.groups || [];
  if (!groups.length) return `<div class="empty">${TP.icon('folder')}${TP.t('res.empty')}</div>`;
  return groups.map(g => `${groups.length > 1 || g.name ? `<div class="res-h" style="font-size:15px">${TP.esc(g.name || TP.t('res.general'))}</div>` : ''}<div class="files">${g.files.map(fileCard).join('')}</div>`).join('');
}
function loadFolder(fid){
  folderReq = fid; FOLDER = { state: 'loading', data: null };
  TP.loadFolder(fid, d => {
    FOLDER = { state: d ? 'live' : 'error', data: d };
    const box = document.getElementById('folderBox'); if (box) box.innerHTML = folderHtml(compState());
  });
}

function studyHtml(){
  const S = C.study;
  const lp = S.labels ? TP.tx(S.labels.pre) : TP.t('pre'), lq = S.labels ? TP.tx(S.labels.post) : TP.t('post');
  const num = v => (Math.round(v * 100) / 100).toFixed(2);
  return `${S.intro ? `<p class="intro">${TP.esc(TP.tx(S.intro))}</p>` : ''}
    ${S.figures ? `<div class="figs">${S.figures.map(f => `<div class="fig"><b>${TP.esc(f.v)}</b><span>${TP.esc(TP.tx(f.l))}</span></div>`).join('')}</div>` : ''}
    ${S.rows ? `<div class="srows">${S.rows.map(r => { const mx = r.max || Math.max(r.pre, r.post) * 1.12;
      return `<div class="srow"><div class="nm">${TP.esc(TP.tx(r))}</div>
      <div class="bars">
        <div class="br"><span>${TP.esc(lp)}</span><span class="tr"><i data-w="${r.pre / mx * 100}%" style="width:0;background:color-mix(in srgb,var(--c) 35%,#fff)"></i></span><b>${num(r.pre)}</b></div>
        <div class="br"><span>${TP.esc(lq)}</span><span class="tr"><i data-w="${r.post / mx * 100}%" style="width:0;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 60%,#fff),var(--c))"></i></span><b>${num(r.post)}</b></div>
      </div>
      <div class="t"><b>t = ${r.t.toFixed(2)}</b><span class="${r.sig ? 'y' : 'n'}">${TP.t(r.sig ? 'sig.y' : 'sig.n')}</span></div></div>`; }).join('')}</div>
    ${S.scale ? `<p class="scale-note">${TP.esc(TP.tx(S.scale))}</p>` : ''}` : ''}
    ${S.table ? `<div class="sub-h" style="margin-top:22px">${TP.esc(TP.tx(S.table.t))}</div><div class="ftable"><table><thead><tr>${L(S.table.head).map(h => `<th>${TP.esc(h)}</th>`).join('')}</tr></thead>
      <tbody>${S.table.rows.map(r => `<tr>${r.map((c, j) => `<td class="${j ? 'num' : 'nm'}">${TP.esc(TP.tx(c))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : ''}
    ${S.notes ? `<ul class="snotes">${L(S.notes).map(n => `<li>${TP.icon('check')}<span>${TP.esc(n)}</span></li>`).join('')}</ul>` : ''}`;
}

function othersHtml(){
  return `<section class="sec"><div class="res-h">${TP.t('others')}</div>
    <div class="others">${COMPS.filter(o => o.id !== C.id).map(o =>
      `<a class="oth glass${o.ready ? '' : ' dim'}" style="--c:${o.color}" href="${compLink(o)}"><span class="gorb"><b>${o.n}</b></span><span><b>${TP.esc(TP.tx(o.short))}</b><small>${TP.esc(TP.tx(o.who))}</small></span></a>`).join('')}</div></section>`;
}

/* الضغط على رقم نموذج ينقل إلى جدول النماذج ويُبرز السطر */
document.addEventListener('click', e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const row = document.getElementById('form-' + f.dataset.form); if (!row) return;
  row.scrollIntoView({ behavior: 'smooth', block: 'center' });
  row.classList.add('hl'); setTimeout(() => row.classList.remove('hl'), 1800);
});

/* إبراز القسم الحالي في الشريط */
let spyObs = null;
function spy(){
  if (spyObs) spyObs.disconnect();
  const tabs = document.getElementById('tabs'); if (!tabs || !('IntersectionObserver' in window)) return;
  const set = sid => tabs.querySelectorAll('a').forEach(a => {
    const on = a.dataset.sec === sid; a.classList.toggle('on', on);
    if (on) { const r = a.getBoundingClientRect(), tr = tabs.getBoundingClientRect(); if (r.left < tr.left || r.right > tr.right) tabs.scrollTo({ left: a.offsetLeft - tabs.clientWidth / 2 + a.clientWidth / 2, behavior: 'smooth' }); }
  });
  spyObs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) set(e.target.id); }), { rootMargin: '-45% 0px -50% 0px' });
  SECTIONS.forEach(([sid]) => { const el = document.getElementById(sid); if (el) spyObs.observe(el); });
}

TP.onLang(render);
TP.onCountdownEnd(render);
TP.applyLang();
if (location.hash) setTimeout(() => { const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }, 60);
TP.loadData(d => { if (d) { DATA = d; render(); } });
</script>
