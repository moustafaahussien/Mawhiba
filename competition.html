<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المسابقة – منصة الموهبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@300;600;900&family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/platform.css">
<script src="js/config.js"></script>
<script src="js/competitions-data.js"></script>

<style>
/* ---------- الهيرو ---------- */
.hero{padding:120px 0 20px}
.crumbs{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-bottom:18px;flex-wrap:wrap}
.crumbs a{color:var(--muted);transition:color .2s}.crumbs a:hover{color:var(--ink)}
.crumbs svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;transform:scaleX(var(--flip))}
.hero-card{display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center;padding:36px;border-radius:36px}
.hero-orb{position:relative;width:180px;height:180px;display:grid;place-items:center}
.hero-orb .gorb{--sz:150px}
.hero-orb .gorb svg{stroke-width:1.5}
.hero-orb .p{position:absolute;inset:15px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c) 60%,transparent);animation:pulse 4s ease-out infinite}
.hero-orb .p.p2{animation-delay:2s}
.hero-orb .ring{position:absolute;inset:-6px;border-radius:50%;border:2px dashed color-mix(in srgb,var(--c) 45%,transparent);animation:spin 40s linear infinite}
.hero .tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.hero h1{font-family:var(--display);font-weight:900;font-size:clamp(28px,4.2vw,52px);line-height:1.35;margin-bottom:8px;
  background:linear-gradient(100deg,color-mix(in srgb,var(--c) 75%,#1A1640),var(--c) 40%,color-mix(in srgb,var(--c) 55%,#E8A50A) 70%,color-mix(in srgb,var(--c) 75%,#1A1640));
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:foil 8s linear infinite}
.hero .org{font-family:var(--display);font-weight:600;color:var(--muted);font-size:15px;margin-bottom:10px}
.hero .sum{color:var(--ink);opacity:.85;font-size:clamp(16px,1.45vw,18px);max-width:46em}
.hero .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
.fact{padding:16px 18px;border-radius:22px}
.fact span{display:block;font-family:var(--display);font-weight:600;font-size:12.5px;color:color-mix(in srgb,var(--c) 70%,#1A1640)}
.fact b{display:block;font-weight:600;font-size:15px;line-height:1.6;margin-top:2px}
@media(max-width:900px){.hero-card{grid-template-columns:1fr;text-align:center;justify-items:center;padding:28px 20px}.hero .tags,.hero .actions{justify-content:center}.facts{grid-template-columns:repeat(2,1fr)}.hero-orb{width:150px;height:150px}.hero-orb .gorb{--sz:124px}.hero{padding-top:100px}}
@media(max-width:480px){.facts{gap:10px}.fact{padding:12px 14px}.fact b{font-size:14px}}

/* ---------- شريط الأقسام ---------- */
.tabs{position:sticky;top:88px;z-index:20;margin:26px 0 8px;padding:8px;border-radius:22px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;font-family:var(--display);font-weight:600;font-size:14px;color:var(--muted);transition:background .2s,color .2s;white-space:nowrap}
.tabs a svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs a:hover{background:rgba(255,255,255,.7);color:var(--ink)}
.tabs a.on{color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));box-shadow:0 8px 18px -8px var(--c)}
@media(max-width:620px){.tabs{top:80px}}

/* ---------- الأقسام ---------- */
.sec{padding:34px 0}
.sec-h{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.sec-h .gorb{--sz:54px}
.sec-h .n{font-family:'Sora',sans-serif;font-weight:800;font-size:13px;color:color-mix(in srgb,var(--c) 70%,#1A1640);letter-spacing:.08em}
.sec-h h2{font-family:var(--display);font-weight:900;font-size:clamp(22px,2.6vw,32px);line-height:1.35}
.panel{padding:28px;border-radius:30px}
@media(max-width:620px){.panel{padding:20px;border-radius:24px}}
.about p{font-size:16.5px;line-height:2;margin-bottom:12px}
.about p:last-child{margin-bottom:0}
.minitable{margin-top:20px;border-radius:20px;overflow:auto;border:1px solid var(--glass-edge);background:rgba(255,255,255,.55)}
.minitable h3{font-family:var(--display);font-weight:900;font-size:16px;padding:14px 18px 0}
.minitable table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:520px;margin-top:10px}
.minitable th{font-family:var(--display);font-weight:600;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));padding:10px 16px;text-align:start}
.minitable td{padding:11px 16px;border-top:1px solid var(--line);vertical-align:top}
.minitable td:first-child{font-weight:600;white-space:nowrap}
.local{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.local .tag{font-size:13.5px;padding:5px 14px}

/* روابط */
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.lk{display:flex;align-items:center;gap:14px;padding:18px;border-radius:24px;transition:transform .25s,box-shadow .25s}
.lk:hover{transform:translateY(-5px);box-shadow:0 26px 44px -24px var(--c)}
.lk .gorb{--sz:48px}
.lk b{display:block;font-family:var(--display);font-weight:600;font-size:15.5px;line-height:1.5}
.lk small{display:block;font-family:'Sora',sans-serif;font-size:12.5px;color:var(--muted);direction:ltr;text-align:start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:210px}
html[dir=rtl] .lk small{text-align:right}
.lk .ext{margin-inline-start:auto;width:18px;height:18px;flex:none;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lk.reg{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 18%,rgba(255,255,255,.75)),rgba(255,255,255,.6));border-color:color-mix(in srgb,var(--c) 40%,#fff)}

/* الشروط */
.conds{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.conds li{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.6);border:1px solid var(--glass-edge);font-size:15.5px;line-height:1.85}
.conds li .gorb{--sz:30px;margin-top:2px}
@media(max-width:800px){.conds{grid-template-columns:1fr}}

/* التسجيل */
.steps{list-style:none;display:grid;gap:0;position:relative}
.steps li{display:grid;grid-template-columns:60px 1fr;gap:16px;align-items:start;position:relative;padding-bottom:18px}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:"";position:absolute;inset-inline-start:28px;top:56px;bottom:-4px;width:4px;border-radius:4px;background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 25%,transparent))}
.steps li:last-child::before{display:none}
.steps .gorb{--sz:58px}
.steps .txt{padding:14px 18px;border-radius:18px;background:rgba(255,255,255,.62);border:1px solid var(--glass-edge);font-size:15.5px;line-height:1.85;margin-top:3px}

/* المخطط الزمني */
.cd-card{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:22px 24px;margin-bottom:22px;border-radius:26px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 20%,rgba(255,255,255,.85)),rgba(255,255,255,.7) 60%,color-mix(in srgb,#E8A50A 14%,rgba(255,255,255,.8)));
  border:1px solid color-mix(in srgb,var(--c) 35%,#fff);box-shadow:0 22px 44px -28px var(--c)}
.cd-info{display:flex;align-items:center;gap:16px}
.cd-info .gorb{--sz:60px}
.cd-info small{display:block;font-family:var(--display);font-weight:600;font-size:13px;color:color-mix(in srgb,var(--c) 70%,#1A1640)}
.cd-info h3{font-family:var(--display);font-weight:900;font-size:clamp(18px,2vw,22px);line-height:1.5}
.cd-info span{font-size:14px;color:var(--muted)}
@media(max-width:700px){.cd-card{flex-direction:column;align-items:stretch}.cd-card .cd-boxes{justify-content:center}}
.tl-label{display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:14px;color:var(--muted)}
.tl-label svg{width:18px;height:18px;flex:none;stroke:var(--c);fill:none;stroke-width:2}
.tl{list-style:none;position:relative;display:grid;gap:14px}
.tl::before{content:"";position:absolute;inset-inline-start:25px;top:10px;bottom:10px;width:4px;border-radius:4px;background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 30%,#fff))}
.tl li{display:grid;grid-template-columns:54px 1fr;gap:14px;align-items:center;position:relative}
.tl .dot{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid color-mix(in srgb,var(--c) 40%,#fff);z-index:1;box-shadow:0 8px 18px -10px var(--c)}
.tl .dot svg{width:22px;height:22px;stroke:color-mix(in srgb,var(--c) 70%,#1A1640);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tl .card{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border-radius:18px;background:rgba(255,255,255,.62);border:1px solid var(--glass-edge)}
.tl .card h4{font-family:var(--display);font-weight:600;font-size:15.5px;line-height:1.6}
.tl .card .when{font-family:var(--display);font-weight:600;font-size:13.5px;color:color-mix(in srgb,var(--c) 70%,#1A1640);white-space:nowrap}
.tl .card small{display:block;color:var(--muted);font-size:13px}
.tl li.past{opacity:.6}
.tl li.past .dot{background:color-mix(in srgb,var(--c) 15%,#fff)}
.tl li.cur .dot,.tl li.next .dot{border-color:transparent;background:radial-gradient(circle at 32% 26%,color-mix(in srgb,var(--c) 40%,#fff),var(--c) 50%,color-mix(in srgb,var(--c) 70%,#1A1640))}
.tl li.cur .dot svg,.tl li.next .dot svg{stroke:#fff}
.tl li.cur .card,.tl li.next .card{border-color:color-mix(in srgb,var(--c) 45%,#fff);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 14%,#fff),rgba(255,255,255,.7))}
.tl .badge{font-family:var(--display);font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;color:#fff;background:var(--c);margin-inline-start:8px;vertical-align:middle}

/* المصادر */
.res-h{font-family:var(--display);font-weight:900;font-size:17px;margin:4px 0 12px;display:flex;align-items:center;gap:10px}
.res-h::after{content:"";flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 40%,transparent),transparent)}
html[dir=rtl] .res-h::after{background:linear-gradient(270deg,color-mix(in srgb,var(--c) 40%,transparent),transparent)}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:22px}
.fl{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:rgba(255,255,255,.62);border:1px solid var(--glass-edge);transition:transform .2s,box-shadow .2s}
.fl:hover{transform:translateY(-3px);box-shadow:0 18px 30px -20px var(--c)}
.fl .ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--fc,var(--c)) 14%,#fff)}
.fl .ico svg{width:22px;height:22px;stroke:var(--fc,var(--c));fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fl b{display:block;font-weight:600;font-size:14.5px;line-height:1.5;word-break:break-word}
.fl small{color:var(--muted);font-size:12.5px}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;padding:10px 0}
.loading i{width:18px;height:18px;border-radius:50%;border:3px solid color-mix(in srgb,var(--c) 25%,#fff);border-top-color:var(--c);animation:spin .8s linear infinite}

/* مكتبة النماذج */
.pp-years{margin-bottom:12px;width:max-content;max-width:100%;box-shadow:none;background:rgba(255,255,255,.6)}
.pp-years button{font-family:'Sora',sans-serif}
.pp-table{margin-top:0;margin-bottom:22px}
.pp-table table{min-width:560px;margin-top:0}
.pp{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:10px;font-family:'Sora',sans-serif;font-weight:600;font-size:12.5px;color:#C0283E;background:#FDE8EB;border:1px solid #F8C9D0;transition:transform .2s,box-shadow .2s}
.pp:hover{transform:translateY(-2px);box-shadow:0 8px 16px -10px #E0354B}
.pp svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.minitable + .minitable{margin-top:16px}

/* التدريب */
.plan{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.plan li{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:18px;background:rgba(255,255,255,.62);border:1px solid var(--glass-edge);font-size:15px;line-height:1.85}
.plan li .gorb{--sz:34px}
@media(max-width:800px){.plan{grid-template-columns:1fr}}
.sched{border-radius:20px;overflow:auto;border:1px solid var(--glass-edge);background:rgba(255,255,255,.55)}
.sched table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:620px}
.sched th{font-family:var(--display);font-weight:600;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));padding:10px 14px;text-align:start}
.sched td{padding:11px 14px;border-top:1px solid var(--line)}
.sched a{color:color-mix(in srgb,var(--c) 70%,#1A1640);font-weight:600}

/* النتائج */
.years{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:22px}
.yr{padding:20px;border-radius:24px;background:rgba(255,255,255,.62);border:1px solid var(--glass-edge)}
.yr h4{font-family:'Sora',sans-serif;font-weight:800;font-size:17px;margin-bottom:12px;color:color-mix(in srgb,var(--c) 70%,#1A1640)}
.fn-row{display:grid;grid-template-columns:84px 1fr 46px 50px;gap:8px;align-items:center;font-size:13.5px;margin-bottom:8px}
.fn-row .nm{color:var(--muted);font-weight:600}
.fn-row .tr{height:22px;border-radius:8px;background:rgba(26,22,64,.06);overflow:hidden}
.fn-row .tr i{display:block;height:100%;border-radius:8px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.fn-row .v{font-family:'Sora',sans-serif;font-weight:800;text-align:end}
.fn-row .pc{font-family:'Sora',sans-serif;font-size:12px;color:var(--muted);text-align:end}
.ach{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.ach li{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:18px;background:rgba(255,255,255,.62);border:1px solid var(--glass-edge)}
.ach li .gorb{--sz:44px}
.ach b{display:block;font-family:var(--display);font-weight:600;font-size:15px;line-height:1.6}
.ach small{display:block;color:var(--muted);font-size:13px}

/* المصادر والمسابقات الأخرى */
.sources{font-size:13px;color:var(--muted);margin-top:30px;padding:16px 20px;border-radius:20px}
.sources b{font-family:var(--display);font-weight:600;color:var(--ink)}
.sources a{display:inline-block;direction:ltr;margin-inline-end:14px;color:color-mix(in srgb,var(--c) 70%,#1A1640);word-break:break-all}
.others{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 14px;scrollbar-width:thin}
.oth{flex:none;display:flex;align-items:center;gap:12px;padding:12px 18px 12px 12px;border-radius:20px;transition:transform .2s}
html[dir=rtl] .oth{padding:12px 12px 12px 18px}
.oth:hover{transform:translateY(-4px)}
.oth .gorb{--sz:42px}
.oth b{font-family:var(--display);font-weight:600;font-size:14.5px;white-space:nowrap}
.notfound{padding:160px 0 60px;text-align:center}
</style>
</head>

       coordinator:'School coordinator', regOverride:'This year’s registration link',
       'tl.sheet':'This year’s dates — updated from the platform data sheet', past:'Done', cur:'Ongoing', next:'Next',
       'res.official':'Official resources', 'res.school':'School packages & resources', 'res.loading':'Loading files…',
       'res.none':'School packages and files appear here automatically once a resources folder is linked in the platform data sheet.',
       'res.err':'Could not access the resources folder — make sure it is shared "Anyone with the link".', 'res.empty':'The folder is empty for now.',
       'res.general':'General files', updated:'Updated',
       'tr.plan':'School preparation plan', 'tr.sched':'Training schedule', 'tr.none':'The training schedule will appear here from the platform data sheet once approved.',
       'th.prog':'Program', 'th.when':'When', 'th.place':'Place', 'th.coach':'Trainer', 'th.target':'Target group', 'th.link':'Link', open:'Open',
       'rs.funnel':'Our participation by year', 'rs.ach':'Our achievements', 'rs.none':'School results and achievements appear here once entered in the platform data sheet.',
       'fn.reg':'Registered', 'fn.qual':'Qualified', 'fn.fin':'Finalists', 'fn.win':'Winners',
       sources:'Sources:', others:'Other competitions', nf:'We could not find this competition.', back:'Back to competitions' }
});

const COMPS = window.TP_COMPETITIONS, FIELDS = window.TP_FIELDS, STAGES = window.TP_STAGES;
const id = (new URLSearchParams(location.search).get('c') || '').toLowerCase();
const C = COMPS.find(c => c.id === id);
let DATA = null, FOLDER = { state: 'none', data: null }, folderReq = '';

const SECTIONS = [
  ['about','info','s.about'], ['link','link','s.link'], ['conditions','check','s.cond'], ['register','list','s.reg'],
  ['timeline','cal','s.tl'], ['resources','folder','s.res'], ['training','coach','s.train'], ['results','trophy','s.results']
];
const host = u => { try { return new URL(u, location.href).host.replace(/^www\./, ''); } catch (e) { return u; } };
const secHead = (i, ic, k) => `<div class="sec-h"><span class="gorb">${TP.icon(ic)}</span><div><div class="n">${String(i + 1).padStart(2, '0')}</div><h2>${TP.t(k)}</h2></div></div>`;
const L = arr => (arr && (arr[TP.lang()] || arr.ar)) || [];

function render(){
  const main = document.getElementById('main');
  if (!C) {
    document.title = TP.t('nf');
    main.innerHTML = `<div class="notfound"><h1 class="foil-title" style="font-size:40px">${TP.t('nf')}</h1><p style="margin-top:20px"><a class="btn primary" href="competitions.html">${TP.t('back')}</a></p></div>`;
    return;
  }
  document.title = TP.tx(C.short) + ' – ' + TP.t('brand');
  document.documentElement.style.setProperty('--c', C.color);
  const st = TP.compState(DATA, C.id);
  const regLink = st.regLink || (C.links.find(l => l.register) || {}).url;
  const offLink = (C.links.find(l => l.primary) || C.links[0] || {}).url;
  const isInternal = u => !/^https?:/i.test(u || '');

  main.innerHTML = `
  <section class="hero">
    <div class="crumbs"><a href="index.html">${TP.t('nav.home')}</a>${TP.icon('arrow')}<a href="competitions.html">${TP.t('comps')}</a>${TP.icon('arrow')}<span>${TP.esc(TP.tx(C.short))}</span></div>
    <div class="hero-card glass">
      <div class="hero-orb"><span class="ring"></span><span class="p"></span><span class="p p2"></span><span class="gorb">${TP.icon(C.icon)}</span></div>
      <div>
        <div class="tags"><span class="tag solid" style="--c:${FIELDS[C.field].c}">${TP.esc(TP.tx(FIELDS[C.field]))}</span>${TP.statusTag(st.status)}${C.stages.map(s => `<span class="tag">${TP.esc(TP.tx(STAGES[s]))}</span>`).join('')}</div>
        <h1>${TP.esc(TP.tx(C.name))}</h1>
        <div class="org">${TP.esc(TP.tx(C.organizer))}</div>
        <p class="sum">${TP.esc(TP.tx(C.summary))}</p>
        <div class="actions">
          ${regLink ? `<a class="btn tint" href="${TP.esc(regLink)}"${isInternal(regLink) ? '' : ' target="_blank" rel="noopener"'}>${TP.icon('check')}<span>${TP.t('register')}</span></a>` : ''}
          ${offLink ? `<a class="btn ghost" href="${TP.esc(offLink)}" target="_blank" rel="noopener">${TP.icon('globe')}<span>${TP.t('official')}</span></a>` : ''}
        </div>
      </div>
    </div>
    <div class="facts">${(C.facts || []).map(f => `<div class="fact glass"><span>${TP.esc(TP.tx(f.k))}</span><b>${TP.esc(TP.tx(f.v))}</b></div>`).join('')}</div>
  </section>

  <nav class="tabs glass no-print" id="tabs">${SECTIONS.map(([sid, ic, k]) => `<a href="#${sid}" data-sec="${sid}">${TP.icon(ic)}<span>${TP.t(k)}</span></a>`).join('')}</nav>

  <section class="sec" id="about">${secHead(0, 'info', 's.about')}
    <div class="panel glass about reveal">${L(C.about).map(p => `<p>${TP.esc(p)}</p>`).join('')}
      ${(C.tables || (C.table ? [C.table] : [])).map(tb => `<div class="minitable"><h3>${TP.esc(TP.tx(tb.title))}</h3><table><thead><tr>${L(tb.head).map(h => `<th>${TP.esc(h)}</th>`).join('')}</tr></thead><tbody>${tb.rows.map(r => `<tr>${L(r).map(c => `<td>${TP.esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`).join('')}
      ${(st.coordinator || st.note) ? `<div class="local">${st.coordinator ? `<span class="tag">${TP.icon('coach')}${TP.t('coordinator')}: ${TP.esc(st.coordinator)}</span>` : ''}${st.note ? `<span class="tag" style="--c:#E8A50A">${TP.esc(st.note)}</span>` : ''}</div>` : ''}
    </div>
  </section>

  <section class="sec" id="link">${secHead(1, 'link', 's.link')}
    <div class="links">
      ${st.regLink ? linkCard({ ar: TP.t('regOverride'), en: TP.t('regOverride'), url: st.regLink, register: true }) : ''}
      ${C.links.map(linkCard).join('')}
    </div>
  </section>

  <section class="sec" id="conditions">${secHead(2, 'check', 's.cond')}
    <div class="panel glass reveal"><ul class="conds">${L(C.conditions).map(x => `<li><span class="gorb">${TP.icon('check')}</span><span>${TP.esc(x)}</span></li>`).join('')}</ul></div>
  </section>

  <section class="sec" id="register">${secHead(3, 'list', 's.reg')}
    <div class="panel glass reveal"><ol class="steps">${L(C.register).map((x, i) => `<li><span class="gorb"><b>${i + 1}</b></span><div class="txt">${TP.esc(x)}</div></li>`).join('')}</ol></div>
  </section>

  <section class="sec" id="timeline">${secHead(4, 'cal', 's.tl')}
    <div class="panel glass reveal">${timelineHtml()}</div>
  </section>

  <section class="sec" id="resources">${secHead(5, 'folder', 's.res')}
    <div class="panel glass reveal">
      ${resourcesHtml()}
      ${C.papers ? `<div class="res-h">${TP.esc(TP.tx(C.papers.title))}</div><div id="papersBox">${papersHtml()}</div>` : ''}
      <div class="res-h">${TP.t('res.school')}</div>
      <div id="folderBox">${folderHtml(st)}</div>
    </div>
  </section>

  <section class="sec" id="training">${secHead(6, 'coach', 's.train')}
    <div class="panel glass reveal">
      <div class="res-h">${TP.t('tr.plan')}</div>
      <ul class="plan">${planItems().map((x, i) => `<li><span class="gorb"><b>${i + 1}</b></span><span>${TP.esc(x)}</span></li>`).join('')}</ul>
      <div class="res-h">${TP.t('tr.sched')}</div>
      ${schedHtml()}
    </div>
  </section>

  <section class="sec" id="results">${secHead(7, 'trophy', 's.results')}
    <div class="panel glass reveal">${resultsHtml()}</div>
  </section>

  <div class="sources glass"><b>${TP.t('sources')}</b> ${(C.sources || []).map(u => `<a href="${TP.esc(u)}" target="_blank" rel="noopener">${TP.esc(host(u))}</a>`).join('')}</div>

  <section class="sec">
    <div class="res-h">${TP.t('others')}</div>
    <div class="others">${COMPS.filter(o => o.id !== C.id).map(o => `<a class="oth glass" style="--c:${o.color}" href="competition.html?c=${o.id}"><span class="gorb">${TP.icon(o.icon)}</span><b>${TP.esc(TP.tx(o.short))}</b></a>`).join('')}</div>
  </section>`;

  TP.observe(main.querySelectorAll('.reveal'));
  TP.tick();
  requestAnimationFrame(() => setTimeout(() => main.querySelectorAll('[data-w]').forEach(el => el.style.width = el.dataset.w), 80));
  spy();
  if (st.folder && folderReq !== st.folder) loadFolder(st.folder);
}

function linkCard(l){
  const url = TP.safeUrl(l.url); if (!url) return '';
  const internal = !/^https?:/i.test(url);
  return `<a class="lk glass reveal${l.register ? ' reg' : ''}" href="${TP.esc(url)}"${internal ? '' : ' target="_blank" rel="noopener"'}>
    <span class="gorb">${TP.icon(l.register ? 'check' : l.primary ? 'globe' : 'link')}</span>
    <span><b>${TP.esc(TP.tx(l))}</b><small>${TP.esc(internal ? TP.tx(C.short) : host(url))}</small></span>${TP.icon('ext', 'ext')}</a>`;
}

function timelineHtml(){
  const D = TP.compDates(C, DATA), now = Date.now();
  const nx = TP.nextDate(D.items);
  const label = D.fromSheet ? TP.t('tl.sheet') : TP.tx(D.label);
  const hero = nx ? `<div class="cd-card">
      <div class="cd-info"><span class="gorb">${TP.icon(TP.phase(nx, now) === 'cur' ? 'clock' : 'cal')}</span>
        <div><small>${TP.t(TP.phase(nx, now) === 'cur' ? 'cur' : 'next')}</small><h3>${TP.esc(TP.tx(nx))}</h3><span>${TP.esc(TP.dateText(nx))}</span></div></div>
      ${TP.countdown(nx)}</div>` : '';
  return `${hero}${label ? `<div class="tl-label">${TP.icon('info')}<span>${TP.esc(label)}</span></div>` : ''}
  <ol class="tl">${D.items.map(i => {
    let cls = '', badge = '';
    const ph = TP.phase(i, now);
    if (ph === 'past') { cls = 'past'; badge = TP.t('past'); }
    else if (ph === 'cur') { cls = 'cur'; badge = TP.t('cur'); }
    else if (nx && i === nx) { cls = 'next'; badge = TP.t('next'); }
    return `<li class="${cls}"><span class="dot">${TP.icon(cls === 'past' ? 'check' : cls === 'cur' ? 'clock' : 'cal')}</span>
      <div class="card"><div><h4>${TP.esc(TP.tx(i))}${badge && cls !== 'past' ? `<span class="badge">${badge}</span>` : ''}</h4>${i.note ? `<small>${TP.esc(i.note)}</small>` : ''}</div>
      <span class="when">${TP.esc(TP.dateText(i))}</span></div></li>`;
  }).join('')}</ol>`;
}

/* المصادر الرسمية: عناصر مفردة أو مجموعات {group, items} */
const resCard = r => fileCard({ name: TP.tx(r), url: r.url, kind: r.type || 'link' });
function resourcesHtml(){
  const res = C.resources || [], flat = res.filter(r => !r.group), groups = res.filter(r => r.group);
  return (flat.length ? `<div class="res-h">${TP.t('res.official')}</div><div class="files">${flat.map(resCard).join('')}</div>` : '') +
    groups.map(g => `<div class="res-h">${TP.esc(TP.tx(g.group))}</div><div class="files">${g.items.map(resCard).join('')}</div>`).join('');
}
/* مكتبة النماذج السابقة (سنة ← مستويات × أعمدة) */
let PAPER_YEAR = null;
function papersHtml(){
  const P = C.papers, years = Object.keys(P.years).sort().reverse();
  if (!PAPER_YEAR || !P.years[PAPER_YEAR]) PAPER_YEAR = years[0];
  const rows = P.years[PAPER_YEAR];
  const cell = u => `<td>${u ? `<a class="pp" href="${TP.esc(encodeURI(decodeURI(u)))}" target="_blank" rel="noopener">${TP.icon('pdf')}<span>PDF</span></a>` : '<span class="muted">—</span>'}</td>`;
  return `<div class="seg pp-years no-print">${years.map(y => `<button type="button" class="${y === PAPER_YEAR ? 'on' : ''}" data-pyear="${y}">${y}</button>`).join('')}</div>
    <div class="minitable pp-table"><table><thead><tr><th>${TP.lang() === 'ar' ? 'المستوى' : 'Level'}</th>${P.cols.map(c => `<th>${TP.esc(TP.tx(c))}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r, i) => `<tr><td>${TP.esc(TP.tx(P.levels[i]))}</td>${r.map(cell).join('')}</tr>`).join('')}</tbody></table></div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-pyear]'); if (!b) return;
  PAPER_YEAR = b.dataset.pyear; const box = document.getElementById('papersBox'); if (box) box.innerHTML = papersHtml();
});

const FILE_KIND = m => /pdf/.test(m) ? ['pdf', '#E0354B'] : /presentation|powerpoint/.test(m) ? ['slides', '#F07B0F'] : /spreadsheet|excel/.test(m) ? ['sheet', '#0E9F76'] :
  /video/.test(m) ? ['video', '#7B4DFF'] : /image/.test(m) ? ['image', '#0EA5D6'] : /document|word/.test(m) ? ['file', '#2F6FE0'] : ['file', ''];
function fileCard(f){
  const url = TP.safeUrl(f.url); if (!url) return '';
  const [ic, col] = f.kind === 'pdf' ? ['pdf', '#E0354B'] : f.kind === 'video' ? ['video', '#E0354B'] : f.kind === 'link' ? ['link', ''] : FILE_KIND(f.mime || '');
  const meta = f.kind === 'link' || f.kind === 'pdf' || f.kind === 'video' ? host(url) : (f.updated ? TP.t('updated') + ': ' + TP.fmtDate(new Date(f.updated)) : '');
  return `<a class="fl" href="${TP.esc(url)}" target="_blank" rel="noopener"${col ? ` style="--fc:${col}"` : ''}><span class="ico">${TP.icon(ic)}</span><span><b>${TP.esc(f.name)}</b><small>${TP.esc(meta)}</small></span></a>`;
}
function folderHtml(st){
  if (!st.folder) return `<div class="empty">${TP.icon('folder')}${TP.t('res.none')}</div>`;
  if (FOLDER.state === 'loading' || FOLDER.state === 'none') return `<div class="loading"><i></i>${TP.t('res.loading')}</div>`;
  if (FOLDER.state === 'error' || !FOLDER.data || FOLDER.data.error) return `<div class="empty">${TP.icon('folder')}${TP.t('res.err')}</div>`;
  const groups = FOLDER.data.groups || [];
  if (!groups.length) return `<div class="empty">${TP.icon('folder')}${TP.t('res.empty')}</div>`;
  return groups.map(g => `${groups.length > 1 || g.name ? `<div class="res-h" style="font-size:15px">${TP.esc(g.name || TP.t('res.general'))}</div>` : ''}<div class="files">${g.files.map(fileCard).join('')}</div>`).join('');
}
function loadFolder(fid){
  folderReq = fid; FOLDER = { state: 'loading', data: null };
  TP.loadFolder(fid, (d, s) => {
    FOLDER = { state: d ? 'live' : 'error', data: d };
    const box = document.getElementById('folderBox'); if (box) box.innerHTML = folderHtml(TP.compState(DATA, C.id));
  });
}

/* خطة الإعداد: من تبويب «خطة الإعداد» في الجدول إن وُجدت، وإلا من ملف البيانات */
function planItems(){
  const rows = DATA ? TP.rowsFor(DATA.plans, C.id).filter(r => (r[0] || '').trim()) : [];
  if (rows.length) return rows.map(r => TP.lang() === 'en' ? (r[1] || r[0]) : r[0]);
  return L(C.training);
}

function schedHtml(){
  const rows = DATA ? TP.rowsFor(DATA.training, C.id) : [];
  if (!rows.length) return `<div class="empty">${TP.icon('cal')}${TP.t('tr.none')}</div>`;
  return `<div class="sched"><table><thead><tr>${['th.prog','th.when','th.place','th.coach','th.target','th.link'].map(k => `<th>${TP.t(k)}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(r => `<tr>${[0,1,2,3,4].map(j => `<td>${TP.esc(r[j] || '—')}</td>`).join('')}<td>${TP.safeUrl(r[5]) ? `<a href="${TP.esc(r[5])}" target="_blank" rel="noopener">${TP.t('open')}</a>` : '—'}</td></tr>`).join('')}</tbody></table></div>`;
}

function resultsHtml(){
  const fun = DATA ? TP.rowsFor(DATA.funnel, C.id).map(r => ({ year: r[3], s: [TP.num(r[4]), TP.num(r[5]), TP.num(r[6]), TP.num(r[7])] })).filter(f => f.s.some(v => v != null)) : [];
  const ach = DATA ? TP.rowsFor(DATA.achievements, C.id).filter(r => (r[1] || '').trim()) : [];
  if (!fun.length && !ach.length) return `<div class="empty">${TP.icon('trophy')}${TP.t('rs.none')}</div>`;
  const names = ['fn.reg','fn.qual','fn.fin','fn.win'];
  const shades = [`color-mix(in srgb,${C.color} 35%,#fff)`, `color-mix(in srgb,${C.color} 60%,#fff)`, C.color, 'linear-gradient(90deg,#FFD45C,#E8A50A)'];
  fun.sort((a, b) => String(b.year).localeCompare(String(a.year)));
  ach.sort((a, b) => String(b[0]).localeCompare(String(a[0])));
  const lvlColor = l => /دولي|international/i.test(l) ? '#7B4DFF' : /وطني|national/i.test(l) ? '#E8A50A' : /إقليمي|regional/i.test(l) ? '#0EA5D6' : '#0E9F76';
  return `${fun.length ? `<div class="res-h">${TP.t('rs.funnel')}</div><div class="years">${fun.map(f => {
      const top = f.s[0] || Math.max(...f.s.filter(v => v != null), 1);
      return `<div class="yr"><h4 class="ltr">${TP.esc(f.year)}</h4>${f.s.map((v, i) => {
        const w = v == null ? 0 : Math.max(2, v / top * 100);
        const p = (i > 0 && v != null && f.s[i - 1]) ? TP.fmt(v / f.s[i - 1] * 100) + '%' : '';
        return `<div class="fn-row"><span class="nm">${TP.t(names[i])}</span><span class="tr"><i data-w="${w}%" style="width:0;background:${shades[i]}"></i></span><span class="v">${TP.fmt(v)}</span><span class="pc">${p}</span></div>`;
      }).join('')}</div>`; }).join('')}</div>` : ''}
    ${ach.length ? `<div class="res-h">${TP.t('rs.ach')}</div><ul class="ach">${ach.map(r => `<li><span class="gorb" style="--c:${lvlColor(r[2] || '')}">${TP.icon('medal')}</span><div><b>${TP.esc(r[1])}</b><small>${[r[0], r[2], r[3]].filter(Boolean).map(TP.esc).join(' · ')}</small></div></li>`).join('')}</ul>` : ''}`;
}

/* إبراز القسم الحالي في الشريط */
let spyObs = null;
function spy(){
  if (spyObs) spyObs.disconnect();
  const tabs = document.getElementById('tabs'); if (!tabs || !('IntersectionObserver' in window)) return;
  const set = sid => tabs.querySelectorAll('a').forEach(a => {
    const on = a.dataset.sec === sid; a.classList.toggle('on', on);
    if (on) { const r = a.getBoundingClientRect(), tr = tabs.getBoundingClientRect(); if (r.left < tr.left || r.right > tr.right) tabs.scrollTo({ left: a.offsetLeft - tabs.clientWidth / 2 + a.clientWidth / 2, behavior: 'smooth' }); }
  });
  spyObs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) set(e.target.id); }), { rootMargin: '-45% 0px -50% 0px' });
  SECTIONS.forEach(([sid]) => { const el = document.getElementById(sid); if (el) spyObs.observe(el); });
}

TP.onLang(render);
TP.onCountdownEnd(render); // عند انتهاء العداد ينتقل تلقائياً للمرحلة التالية
TP.applyLang();
if (location.hash) setTimeout(() => { const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }, 60);
TP.loadData(d => { if (d) { DATA = d; render(); } });
</script>
